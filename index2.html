<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFinder by Area</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            text-align: center;
            padding: 20px 20px 0;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar styles */
        .sidebar {
            width: 200px;
            background-color: #252525;
            border-right: 1px solid #404040;
            padding: 20px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .area-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            border-left: 3px solid transparent;
        }

        .area-item:hover {
            background-color: #2d2d2d;
            border-left-color: #505050;
        }

        .area-item.active {
            background-color: #2d2d2d;
            border-left-color: #8b0000;
            color: #ffffff;
            font-weight: bold;
        }

        /* Content area */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .search-container {
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-row {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            position: relative;
        }

        .category-label {
            font-weight: bold;
            color: #b0b0b0;
            margin-right: 10px;
            min-width: 30px;
            flex-shrink: 0;
            padding-top: 6px; /* Align with key-item padding */
        }

        .keys-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .key-item {
            display: inline-block;
            padding: 6px 13px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            font-size: 14px;
            width: var(--key-item-width, 48px);
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .key-item:hover {
            background-color: #3d3d3d;
            border-color: #505050;
        }

        .key-item.empty {
            background-color: #252525;
            color: #808080;
            border-color: #353535;
        }

        .key-item.empty:hover {
            background-color: #2d2d2d;
            color: #909090;
        }

        .key-item.highlighted {
            background-color: #8b0000 !important;
            border-color: #a00000 !important;
        }

        .key-item.highlighted.empty {
            background-color: #6b0000 !important;
            border-color: #800000 !important;
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
        }

        .modal-list {
            list-style: none;
        }

        .modal-list li {
            padding: 8px 0;
            border-bottom: 1px solid #404040;
            color: #e0e0e0;
        }

        .modal-list li:last-child {
            border-bottom: none;
        }

        .item-id {
            font-weight: 500;
        }

        .item-qty {
            color: #b0b0b0;
            margin-left: 10px;
        }

        /* Mobile view */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 150px;
                border-right: none;
                border-bottom: 1px solid #404040;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px 0;
            }

            .area-item {
                padding: 10px 15px;
                white-space: nowrap;
                border-left: none;
                border-bottom: 3px solid transparent;
            }

            .area-item:hover {
                border-left-color: transparent;
                border-bottom-color: #505050;
            }

            .area-item.active {
                border-left-color: transparent;
                border-bottom-color: #8b0000;
            }

            .category-label {
                display: none;
            }

            .category-row {
                justify-content: flex-start;
            }

            .key-item {
                flex: 0 0 calc((100% - 6 * 10px) / 7);
                min-width: 0;
                width: auto;
            }

            .search-container {
                flex-wrap: nowrap;
            }

            #searchInput {
                width: 130px;
            }

            .modal-content {
                width: 95%;
                max-width: none;
                padding: 20px;
                margin: 10px;
            }

            .modal-header {
                font-size: 18px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <h1>StockFinder by Area</h1>
    <div class="main-container">
        <div class="sidebar" id="sidebar"></div>
        <div class="content-area">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search ID..." style="padding: 10px 15px; background-color: #2d2d2d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; font-size: 14px; width: 200px;" />
                <div class="example-container" style="display: flex; align-items: center; gap: 8px;">
                    <span style="color: #b0b0b0; font-size: 14px;">Example: 805.481.85</span>
                    <button id="copyExampleBtn" style="padding: 6px 12px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px;">Copy</button>
                </div>
                <input type="file" id="fileInput" accept=".json" style="display: none;" />
                <button id="openFileBtn" style="display: none; padding: 10px 15px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 14px;">Open local JSON file</button>
            </div>
            <div id="content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header" id="modalHeader"></div>
            <ul class="modal-list" id="modalList"></ul>
        </div>
    </div>

    <script>
        let data = {};
        let currentSearchId = '';
        let currentArea = '';
        let areasData = {}; // Grouped by area

        // Check if running locally (file://) or on GitHub Pages
        function isLocal() {
            return window.location.protocol === 'file:' || 
                   window.location.hostname === '' || 
                   window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1';
        }

        // Load JSON file automatically from GitHub Pages
        async function loadData() {
            // Only auto-load if on GitHub Pages
            if (!isLocal()) {
                try {
                    const response = await fetch('export.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    let text = await response.text();
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    groupByArea();
                    renderSidebar();
                    // Auto-select first area if available
                    const areas = Object.keys(areasData).sort();
                    if (areas.length > 0) {
                        selectArea(areas[0]);
                    }
                } catch (error) {
                    console.error('Error loading JSON:', error);
                    const errorMsg = error.message || 'Unknown error';
                    document.getElementById('content').innerHTML = 
                        '<p style="color: #ff6b6b;">Error loading JSON file: ' + errorMsg + '</p>' +
                        '<p style="color: #ff6b6b; font-size: 12px;">Please check if export.json exists and is accessible.</p>';
                }
            }
        }

        // Load JSON from local file using File API
        function loadLocalFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    groupByArea();
                    renderSidebar();
                    // Auto-select first area if available
                    const areas = Object.keys(areasData).sort();
                    if (areas.length > 0) {
                        selectArea(areas[0]);
                    }
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                    document.getElementById('content').innerHTML = 
                        '<p style="color: #ff6b6b;">Error parsing JSON file: ' + error.message + '</p>';
                }
            };
            reader.onerror = function() {
                document.getElementById('content').innerHTML = 
                    '<p style="color: #ff6b6b;">Error reading file.</p>';
            };
            reader.readAsText(file);
        }

        // Group data by area
        function groupByArea() {
            areasData = {};
            for (const key in data) {
                const area = data[key]?.area || 'Unknown';
                if (!areasData[area]) {
                    areasData[area] = [];
                }
                areasData[area].push(key);
            }
            // Sort keys within each area
            for (const area in areasData) {
                areasData[area].sort((a, b) => {
                    // Extract category and number for sorting
                    const aCategory = a.match(/^([A-Za-z]+)/)?.[1] || '';
                    const bCategory = b.match(/^([A-Za-z]+)/)?.[1] || '';
                    if (aCategory !== bCategory) {
                        return aCategory.localeCompare(bCategory);
                    }
                    const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                    const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                    return aNum - bNum;
                });
            }
        }

        // Render sidebar with areas
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';
            
            const areas = Object.keys(areasData).sort((a, b) => {
                // Sort areas: Area1, Area2, Area3, etc.
                const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                return aNum - bNum;
            });

            for (const area of areas) {
                const areaItem = document.createElement('div');
                areaItem.className = 'area-item';
                areaItem.textContent = area;
                areaItem.addEventListener('click', () => selectArea(area));
                sidebar.appendChild(areaItem);
            }
        }

        // Select area and render its content
        function selectArea(area) {
            currentArea = area;
            
            // Update active state in sidebar
            const areaItems = document.querySelectorAll('.area-item');
            areaItems.forEach(item => {
                if (item.textContent === area) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Render content for selected area
            renderAreaContent(area);
        }

        // Extract category letter from key (e.g., "P1" -> "P", "i2" -> "i")
        function getCategory(key) {
            return key.match(/^([A-Za-z]+)/)?.[1] || '';
        }

        // Extract number from key (e.g., "P10" -> 10)
        function getNumber(key) {
            const match = key.match(/\d+$/);
            return match ? parseInt(match[0], 10) : 0;
        }

        // Check if key has any items
        function hasItems(key) {
            return data[key] && Array.isArray(data[key].items) && data[key].items.length > 0;
        }

        // Render content for selected area
        function renderAreaContent(area) {
            const content = document.getElementById('content');
            const keys = areasData[area] || [];
            
            // Group keys by category
            const grouped = {};
            for (const key of keys) {
                const category = getCategory(key);
                if (!category) continue;
                
                if (!grouped[category]) {
                    grouped[category] = [];
                }
                grouped[category].push(key);
            }

            // Sort categories: single-letter categories first, then multi-letter categories
            const sortedCategories = Object.keys(grouped).sort((a, b) => {
                const aIsSingle = a.length === 1;
                const bIsSingle = b.length === 1;
                
                // Single-letter categories come before multi-letter categories
                if (aIsSingle && !bIsSingle) return -1;
                if (!aIsSingle && bIsSingle) return 1;
                
                // Within same group, sort alphabetically
                // Special case: "i" should come immediately after "H"
                if (a === 'i' && b === 'H') return 1;
                if (a === 'H' && b === 'i') return -1;
                if (a === 'i') {
                    if (b === 'H') return 1;
                    if (b < 'H' && b >= 'A') return 1;
                    if (b > 'H' && b <= 'Z') return -1;
                    return -1;
                }
                if (b === 'i') {
                    if (a === 'H') return -1;
                    if (a < 'H' && a >= 'A') return -1;
                    if (a > 'H' && a <= 'Z') return 1;
                    return 1;
                }
                return a.localeCompare(b);
            });
            
            // Sort keys within each category numerically
            for (const category of sortedCategories) {
                grouped[category].sort((a, b) => {
                    return getNumber(a) - getNumber(b);
                });
            }

            content.innerHTML = '';

            // Find the longest key to determine uniform width
            let longestKey = '';
            let maxLength = 0;
            for (const category of sortedCategories) {
                const categoryKeys = grouped[category];
                for (const key of categoryKeys) {
                    if (key.length > maxLength) {
                        maxLength = key.length;
                        longestKey = key;
                    }
                }
            }

            // Calculate width needed for longest key
            // Create a temporary element to measure
            // Use inline style to override CSS variable for accurate measurement
            const tempElement = document.createElement('div');
            tempElement.className = 'key-item';
            tempElement.style.position = 'absolute';
            tempElement.style.visibility = 'hidden';
            tempElement.style.width = 'auto'; // Override CSS variable for measurement
            tempElement.style.minWidth = '48px'; // Use minimum width
            tempElement.textContent = longestKey || 'AB27'; // Fallback to AB27 if no keys
            document.body.appendChild(tempElement);
            const maxWidth = tempElement.offsetWidth;
            document.body.removeChild(tempElement);

            // Add 15% extra width to make boxes slightly wider
            const finalWidth = maxWidth * 1.15;

            // Set CSS variable for key-item width
            document.documentElement.style.setProperty('--key-item-width', finalWidth + 'px');

            for (const category of sortedCategories) {
                const categoryKeys = grouped[category];
                
                // Check if category has at least one non-empty key
                const hasNonEmpty = categoryKeys.some(key => hasItems(key));
                
                if (!hasNonEmpty) {
                    continue; // Skip empty categories
                }

                const row = document.createElement('div');
                row.className = 'category-row';

                const label = document.createElement('div');
                label.className = 'category-label';
                label.textContent = category;
                row.appendChild(label);

                // Create container for keys
                const keysContainer = document.createElement('div');
                keysContainer.className = 'keys-container';

                // Find first key number to calculate offset
                const firstKeyNumber = categoryKeys.length > 0 ? getNumber(categoryKeys[0]) : 1;
                const offset = firstKeyNumber - 1;

                // Add empty spaces for offset (visual alignment)
                // Skip offset on mobile to avoid flexbox issues
                const isMobile = window.innerWidth <= 768;
                if (!isMobile) {
                    for (let i = 0; i < offset; i++) {
                        const emptyItem = document.createElement('div');
                        emptyItem.className = 'key-item empty';
                        emptyItem.style.visibility = 'hidden';
                        keysContainer.appendChild(emptyItem);
                    }
                }

                for (const key of categoryKeys) {
                    const keyItem = document.createElement('div');
                    keyItem.className = 'key-item';
                    
                    if (!hasItems(key)) {
                        keyItem.classList.add('empty');
                    }
                    
                    keyItem.textContent = key;
                    keyItem.addEventListener('click', () => showModal(key));
                    
                    // Re-apply highlight if this key should be highlighted
                    if (currentSearchId) {
                        const items = (data[key] && data[key].items) || [];
                        const hasId = items.some(item => item.id === currentSearchId);
                        if (hasId) {
                            keyItem.classList.add('highlighted');
                        }
                    }
                    
                    keysContainer.appendChild(keyItem);
                }

                row.appendChild(keysContainer);

                content.appendChild(row);
            }
        }

        // Show modal with key data
        function showModal(key) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalHeader = document.getElementById('modalHeader');
            const modalList = document.getElementById('modalList');

            modalHeader.textContent = key;
            modalList.innerHTML = '';

            const items = (data[key] && data[key].items) || [];
            
            if (items.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No items';
                li.style.color = '#808080';
                modalList.appendChild(li);
            } else {
                for (const item of items) {
                    const li = document.createElement('li');
                    
                    const idSpan = document.createElement('span');
                    idSpan.className = 'item-id';
                    idSpan.textContent = item.id || 'N/A';
                    li.appendChild(idSpan);

                    // Show qty only if it exists and is not 0, null, or empty
                    if (item.qty !== undefined && item.qty !== null && item.qty !== 0 && item.qty !== '') {
                        const qtySpan = document.createElement('span');
                        qtySpan.className = 'item-qty';
                        qtySpan.textContent = `(qty: ${item.qty})`;
                        li.appendChild(qtySpan);
                    }

                    modalList.appendChild(li);
                }
            }

            modalOverlay.classList.add('active');
        }

        // Close modal when clicking outside
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        });

        // Search for ID and highlight keys
        function searchAndHighlight(searchId) {
            // Remove all previous highlights
            const allKeyItems = document.querySelectorAll('.key-item');
            allKeyItems.forEach(item => {
                item.classList.remove('highlighted');
            });

            if (!searchId || searchId.trim() === '') {
                currentSearchId = '';
                return;
            }

            const searchIdTrimmed = searchId.trim();
            currentSearchId = searchIdTrimmed;
            const keysToHighlight = [];

            // Search through all keys in current area
            if (currentArea && areasData[currentArea]) {
                for (const key of areasData[currentArea]) {
                    const items = (data[key] && data[key].items) || [];
                    const hasId = items.some(item => item.id === searchIdTrimmed);
                    
                    if (hasId) {
                        keysToHighlight.push(key);
                    }
                }
            }

            // Highlight found keys
            keysToHighlight.forEach(key => {
                const keyItems = document.querySelectorAll('.key-item');
                keyItems.forEach(item => {
                    if (item.textContent === key) {
                        item.classList.add('highlighted');
                    }
                });
            });
        }

        // Initialize UI based on environment
        function initializeUI() {
            if (isLocal()) {
                // Show "Open local file" button for local usage
                document.getElementById('openFileBtn').style.display = 'block';
            } else {
                // Hide button and auto-load for GitHub Pages
                document.getElementById('openFileBtn').style.display = 'none';
                loadData();
            }
        }

        // Initialize on page load
        initializeUI();

        // File input change handler
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                loadLocalFile(file);
            }
        });

        // Open file button click handler
        document.getElementById('openFileBtn').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        // Search input event listener
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const searchId = this.value;
                searchAndHighlight(searchId);
            }
        });

        // Clear highlights when input is cleared
        document.getElementById('searchInput').addEventListener('input', function(e) {
            if (this.value.trim() === '') {
                currentSearchId = '';
                const allKeyItems = document.querySelectorAll('.key-item');
                allKeyItems.forEach(item => {
                    item.classList.remove('highlighted');
                });
            }
        });

        // Copy example ID button
        document.getElementById('copyExampleBtn').addEventListener('click', function() {
            const exampleId = '805.481.85';
            navigator.clipboard.writeText(exampleId).then(function() {
                // Paste into search input
                const searchInput = document.getElementById('searchInput');
                searchInput.value = exampleId;
                searchInput.focus();
                // Trigger search
                searchAndHighlight(exampleId);
            }).catch(function(err) {
                console.error('Failed to copy:', err);
                // Fallback: just set the value
                const searchInput = document.getElementById('searchInput');
                searchInput.value = exampleId;
                searchInput.focus();
                searchAndHighlight(exampleId);
            });
        });
    </script>
</body>
</html>
