                // First, try to find as a key (e.g., "A4", "AB1", "i1")
                // Try exact match first (supports lowercase keys like "i1")
                let item = data[searchTerm];
                if (item) {
                    foundResults.push({ key: searchTerm, item: item });
                } else {
                    // Try uppercase version (for keys like "A4", "AB1")
                    item = data[searchTermUpper];
                    if (item) {
                        foundResults.push({ key: searchTermUpper, item: item });
                    }
                }
                
                if (foundResults.length === 0) {
                    // If not found as key, search by ID (e.g., "111.222.33")
                    // Find all keys that contain this ID
                    for (const key in data) {
                        const dataItem = data[key];
                        if (dataItem && dataItem.items) {
                            const foundItem = dataItem.items.find(itemObj => 
                                itemObj.id && itemObj.id === searchTerm
                            );
                            if (foundItem) {
                                foundResults.push({ key: key, item: dataItem });
                            }
                        }
                    }
                }

                if (foundResults.length === 0) {
                    // Not found as key or ID
                    searchResults.innerHTML = '<div class="search-no-results">Not found: ' + searchTerm + '</div>';
                    searchResults.classList.add('active');
                    return;
                }

                // Clear colorDesc selection first
                selectedColorDescs.clear();
                const colorDescItems = document.querySelectorAll('.color-desc-item');
                colorDescItems.forEach(colorDescItem => {
                    colorDescItem.classList.remove('active');
                });
                
                // Deactivate all areas first
                const areaItems = document.querySelectorAll('.area-item');
                areaItems.forEach(areaItem => {
                    areaItem.classList.remove('active');
                });

                // Collect unique areas to activate
                const areasToActivate = new Set();
                foundResults.forEach(result => {
                    if (result.item.area) {
                        areasToActivate.add(result.item.area);
                    }
                });

                // Activate all areas that contain the found keys/IDs
                areaItems.forEach(areaItem => {
                    const areaName = areaItem.dataset.areaName || areaItem.textContent.split(' ')[0];
                    if (areasToActivate.has(areaName)) {
                        areaItem.classList.add('active');
                    }
                });

                // Update currentArea to first found area (or last if multiple)
                if (areasToActivate.size > 0) {
                    currentArea = Array.from(areasToActivate)[0];
                }

                // Update area boxes and info area
                updateAreaBoxes();
                updateInfoArea();

                // Display all results
                searchResults.innerHTML = '';
                foundResults.forEach(result => {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'search-result-item';

                    // Key
                    const keyDiv = document.createElement('div');
                    keyDiv.className = 'search-result-key';
                    keyDiv.textContent = result.key;
                    resultDiv.appendChild(keyDiv);

                    // Area
                    const areaDiv = document.createElement('div');
                    areaDiv.className = 'search-result-info';
                    areaDiv.innerHTML = '<strong>Area:</strong> ' + (result.item.area || 'N/A');
                    resultDiv.appendChild(areaDiv);

                    // ColorDesc
                    const colorDescDiv = document.createElement('div');
                    colorDescDiv.className = 'search-result-info';
                    const colorDescValue = result.item.colorDesc || 'N/A';
                    const colorDescHtml = colorDescValue !== 'N/A' 
                        ? `<span style="color: #4a9eff;">${colorDescValue}</span>`
                        : colorDescValue;
                    colorDescDiv.innerHTML = '<strong>Description:</strong> ' + colorDescHtml;
                    resultDiv.appendChild(colorDescDiv);

                    // Items (IDs)
                    if (result.item.items && result.item.items.length > 0) {
                        const itemsDiv = document.createElement('div');
                        itemsDiv.className = 'search-result-items';
                        const itemsTitle = document.createElement('div');
                        itemsTitle.className = 'search-result-info';
                        itemsTitle.innerHTML = '<strong>Items (' + result.item.items.length + '):</strong>';
                        itemsDiv.appendChild(itemsTitle);

                        result.item.items.forEach(itemObj => {
                            const itemIdDiv = document.createElement('div');
                            itemIdDiv.className = 'search-result-item-id';
                            // Highlight the searched ID if it matches
                            if (itemObj.id === searchTerm) {
                                itemIdDiv.style.color = '#4a9eff';
                                itemIdDiv.style.fontWeight = 'bold';
                            }
                            itemIdDiv.textContent = itemObj.id || 'N/A';
                            itemsDiv.appendChild(itemIdDiv);
                        });

                        resultDiv.appendChild(itemsDiv);
                    } else {
                        const noItemsDiv = document.createElement('div');
                        noItemsDiv.className = 'search-result-info';
                        noItemsDiv.textContent = 'No items found';
                        resultDiv.appendChild(noItemsDiv);
                    }

                    searchResults.appendChild(resultDiv);
                });

                searchResults.classList.add('active');
            }

            // Search button click
            if (searchBtn) {
                searchBtn.addEventListener('click', performSearch);
            }

            // Enter key in search input
            if (keySearchInput) {
                keySearchInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        performSearch();
                    }
                });
            }
        });

        // Draggable and resizable box functionality
        let isDragging = false;
        let isResizing = false;
        let currentHandle = null;
        let startX, startY, startLeft, startTop, startWidth, startHeight;
        let boxElement = null;
        let mapContainer = null;
        let mapImage = null;

        function initDraggableBox() {
            boxElement = document.getElementById('areaBox');
            mapContainer = document.getElementById('mapContainer');
            mapImage = document.getElementById('mapImage');

            // Center the box initially
            centerBox();

            // Make box draggable
            boxElement.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);

            // Make resize handles work
            const handles = boxElement.querySelectorAll('.resize-handle');
            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => startResize(e, handle));
            });

            // Update coordinates display
            updateCoordinates();
        }

        function centerBox() {
            if (!mapImage || !boxElement) return;
            
            // Wait for image to load
            if (mapImage.complete) {
                positionBox();
            } else {
                mapImage.addEventListener('load', positionBox);
            }
        }

        function positionBox() {
            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            
            // Calculate image position relative to container
            const imgLeft = imgRect.left - containerRect.left;
            const imgTop = imgRect.top - containerRect.top;
            
            // Center box on image (100x100px box)
            const boxWidth = 100;
            const boxHeight = 100;
            const boxLeft = imgLeft + (imgRect.width / 2) - (boxWidth / 2);
            const boxTop = imgTop + (imgRect.height / 2) - (boxHeight / 2);
            
            boxElement.style.left = boxLeft + 'px';
            boxElement.style.top = boxTop + 'px';
            boxElement.style.width = boxWidth + 'px';
            boxElement.style.height = boxHeight + 'px';
            
            updateCoordinates();
        }

        function startDrag(e) {
            if (e.target.classList.contains('resize-handle')) return;
            isDragging = true;
            const rect = boxElement.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            startLeft = rect.left - containerRect.left;
            startTop = rect.top - containerRect.top;
            e.preventDefault();
        }

        function onDrag(e) {
            if (!isDragging && !isResizing) return;
            
            const containerRect = mapContainer.getBoundingClientRect();
            const imgRect = mapImage.getBoundingClientRect();
            
            if (isDragging) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let newLeft = startLeft + deltaX;
                let newTop = startTop + deltaY;
                
                // Constrain to image bounds
                const imgLeft = imgRect.left - containerRect.left;
                const imgTop = imgRect.top - containerRect.top;
                const maxLeft = imgLeft + imgRect.width - boxElement.offsetWidth;
                const maxTop = imgTop + imgRect.height - boxElement.offsetHeight;
                
                newLeft = Math.max(imgLeft, Math.min(newLeft, maxLeft));
                newTop = Math.max(imgTop, Math.min(newTop, maxTop));
                
                boxElement.style.left = newLeft + 'px';
                boxElement.style.top = newTop + 'px';
            } else if (isResizing) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let newWidth = startWidth;
                let newHeight = startHeight;
                let newLeft = startLeft;
                let newTop = startTop;
                
                const imgRect = mapImage.getBoundingClientRect();
                const imgLeft = imgRect.left - containerRect.left;
                const imgTop = imgRect.top - containerRect.top;
                const maxWidth = imgLeft + imgRect.width - startLeft;
                const maxHeight = imgTop + imgRect.height - startTop;
                
                if (currentHandle.classList.contains('se')) {
                    newWidth = Math.max(50, Math.min(startWidth + deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight + deltaY, maxHeight));
                } else if (currentHandle.classList.contains('sw')) {
                    newWidth = Math.max(50, Math.min(startWidth - deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight + deltaY, maxHeight));
                    newLeft = startLeft + (startWidth - newWidth);
                } else if (currentHandle.classList.contains('ne')) {
                    newWidth = Math.max(50, Math.min(startWidth + deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight - deltaY, maxHeight));
                    newTop = startTop + (startHeight - newHeight);
                } else if (currentHandle.classList.contains('nw')) {
                    newWidth = Math.max(50, Math.min(startWidth - deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight - deltaY, maxHeight));
                    newLeft = startLeft + (startWidth - newWidth);
                    newTop = startTop + (startHeight - newHeight);
                }
                
                // Constrain to image bounds
                if (newLeft < imgLeft) {
                    newWidth += (imgLeft - newLeft);
                    newLeft = imgLeft;
                }
                if (newTop < imgTop) {
                    newHeight += (imgTop - newTop);
                    newTop = imgTop;
                }
                
                boxElement.style.left = newLeft + 'px';
                boxElement.style.top = newTop + 'px';
                boxElement.style.width = newWidth + 'px';
                boxElement.style.height = newHeight + 'px';
            }
            
            updateCoordinates();
        }

        function stopDrag() {
            isDragging = false;
            isResizing = false;
            currentHandle = null;
        }

        function startResize(e, handle) {
            isResizing = true;
            currentHandle = handle;
            const rect = boxElement.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            startLeft = rect.left - containerRect.left;
            startTop = rect.top - containerRect.top;
            startWidth = rect.width;
            startHeight = rect.height;
            e.preventDefault();
            e.stopPropagation();
        }

        function updateCoordinates() {
            if (!boxElement || !mapImage) return;
            
            const boxRect = boxElement.getBoundingClientRect();
            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            
            // Absolute coordinates relative to container
            const absX = boxRect.left - containerRect.left;
            const absY = boxRect.top - containerRect.top;
            const absWidth = boxRect.width;
            const absHeight = boxRect.height;
            
            // Relative coordinates relative to image
            const imgLeft = imgRect.left - containerRect.left;
            const imgTop = imgRect.top - containerRect.top;
            const relX = ((absX - imgLeft) / imgRect.width) * 100;
            const relY = ((absY - imgTop) / imgRect.height) * 100;
            const relWidth = (absWidth / imgRect.width) * 100;
            const relHeight = (absHeight / imgRect.height) * 100;
            
            document.getElementById('coordX').textContent = Math.round(absX);
            document.getElementById('coordY').textContent = Math.round(absY);
            document.getElementById('coordWidth').textContent = Math.round(absWidth);
            document.getElementById('coordHeight').textContent = Math.round(absHeight);
            document.getElementById('coordRelX').textContent = relX.toFixed(2);
            document.getElementById('coordRelY').textContent = relY.toFixed(2);
            document.getElementById('coordRelWidth').textContent = relWidth.toFixed(2);
            document.getElementById('coordRelHeight').textContent = relHeight.toFixed(2);
        }

        // Copy coordinates button
        document.getElementById('copyCoordsBtn').addEventListener('click', function() {
            const coords = {
                x: document.getElementById('coordX').textContent,
                y: document.getElementById('coordY').textContent,
                width: document.getElementById('coordWidth').textContent,
                height: document.getElementById('coordHeight').textContent,
                relX: document.getElementById('coordRelX').textContent,
                relY: document.getElementById('coordRelY').textContent,
                relWidth: document.getElementById('coordRelWidth').textContent,
                relHeight: document.getElementById('coordRelHeight').textContent
            };
            
            const coordsText = `X: ${coords.x}px, Y: ${coords.y}px, Width: ${coords.width}px, Height: ${coords.height}px\n` +
                              `Relative: X: ${coords.relX}%, Y: ${coords.relY}%, Width: ${coords.relWidth}%, Height: ${coords.relHeight}%`;
            
            navigator.clipboard.writeText(coordsText).then(() => {
                this.textContent = 'Copied!';
                setTimeout(() => {
                    this.textContent = 'Copy Coordinates';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        });

        // Handle window resize to adjust box position
        function handleResize() {
            stopMapBoxEdit();
            if (boxElement && mapImage) {
                updateCoordinates();
            }
            // Update floor labels when window resizes
            updateFloorLabels();
            // Update area boxes when window resizes
            updateAreaBoxes();
            // Update info area when window resizes
            updateInfoArea();
        }

        // Initialize draggable box when page loads
        window.addEventListener('load', function() {
            initDraggableBox();
            // Update area boxes when image loads
            if (mapImage) {
                mapImage.addEventListener('load', updateAreaBoxes);
            }
        });

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                handleResize();
                // Re-render sidebar if switching between mobile/desktop view
                if (areasList.length > 0) {
                    renderSidebar();
                }
            }, 100);
        });
    </script>
