<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFinder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-align: center;
            padding: 20px 20px 0;
            font-size: 1.2em; /* Väiksem kui vaikimisi h1 suurus */
        }

        .title-detail-link {
            color: #4a9eff;
            font-size: 0.85em;
            font-weight: 500;
            text-decoration: none;
            margin-left: 8px;
            white-space: nowrap;
        }

        .title-detail-link:hover {
            text-decoration: underline;
            color: #7ab8ff;
        }

        .top-links {
            width: min(100%, 1100px);
            margin: 0 auto 12px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .top-links a {
            color: #4a9eff;
            text-decoration: none;
            font-size: 0.9em;
            white-space: nowrap;
        }

        .top-links a:hover {
            color: #7ab8ff;
            text-decoration: underline;
        }

        .file-container {
            padding: 10px 20px;
            border-bottom: 1px solid #404040;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar styles */
        .sidebar {
            width: 250px;
            background-color: #252525;
            border-right: 1px solid #404040;
            padding: 20px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .area-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .area-item:hover {
            background-color: #2d2d2d;
            border-left-color: #505050;
        }

        .area-item.active {
            background-color: #2d2d2d;
            border-left-color: #FFD700;
            color: #ffffff;
            font-weight: bold;
        }

        .area-item.active.floor1 {
            border-left-color: #ff4444;
        }

        /* ColorDesc items - same style as area items */
        .color-desc-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .color-desc-item:hover {
            background-color: #2d2d2d;
            border-left-color: #505050;
        }

        .color-desc-item.active {
            background-color: #2d2d2d;
            border-left-color: #4a9eff;
            color: #ffffff;
            font-weight: bold;
        }

        /* Content area with image */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }

        .map-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .map-image {
            max-width: 100%;
            max-height: 100%;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Info area */
        .info-area {
            width: 300px;
            background-color: #252525;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .info-area h3 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }

        .info-area-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #404040;
        }

        .info-area-section:last-child {
            border-bottom: none;
        }

        .info-area-section-title {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .info-area-item {
            color: #e0e0e0;
            font-size: 13px;
            margin: 5px 0;
            padding-left: 10px;
            font-family: monospace;
        }

        /* Search section */
        .search-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #404040;
        }

        .search-box-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            font-family: monospace;
        }

        .search-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .search-button {
            padding: 8px 16px;
            background-color: #3d3d3d;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .search-button:hover {
            background-color: #4d4d4d;
        }

        .search-example {
            color: #808080;
            font-size: 10px;
            margin-top: 4px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .search-results {
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .search-result-key {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .search-result-info {
            color: #b0b0b0;
            font-size: 12px;
            margin: 4px 0;
        }

        .search-result-info strong {
            color: #e0e0e0;
        }

        .search-result-items {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #404040;
        }

        .search-result-item-id {
            color: #e0e0e0;
            font-size: 12px;
            font-family: monospace;
            margin: 3px 0;
            padding-left: 10px;
        }

        .search-no-results {
            color: #b0b0b0;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* Draggable and resizable box - for coordinate editing */
        /* Hidden by default - uncomment or set display: block to show */
        .area-box {
            position: absolute;
            border: 2px solid #8b0000;
            background-color: rgba(139, 0, 0, 0.2);
            cursor: move;
            min-width: 50px;
            min-height: 50px;
            display: none; /* Hidden - set to 'block' to show for coordinate editing */
        }

        /* Area boxes on map - shown based on active areas */
        .map-area-box {
            position: absolute;
            border: 2px solid #4a9eff;
            background-color: rgba(74, 158, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-sizing: border-box;
            z-index: 10;
        }

        .map-container.edit-mode .map-area-box {
            pointer-events: auto;
            cursor: move;
        }

        .map-container.edit-mode .map-area-box.selected {
            border-color: #ffd700;
            background-color: rgba(255, 215, 0, 0.2);
            z-index: 20;
        }

        .map-area-box .area-label {
            color: #4a9eff;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
            max-width: 100%;
        }

        .map-area-box .area-label,
        .map-area-box .area-info-text {
            pointer-events: none;
        }

        .map-box-resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            border: 1px solid #1a1a1a;
            display: none;
            z-index: 25;
        }

        .map-container.edit-mode .map-area-box.selected .map-box-resize-handle {
            display: block;
        }

        .map-box-resize-handle.nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .map-box-resize-handle.ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .map-box-resize-handle.sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .map-box-resize-handle.se { bottom: -6px; right: -6px; cursor: nwse-resize; }

        /* Area 11 special layout - two rows */
        .map-area-box.area-11 {
            flex-direction: column;
            justify-content: center;
        }

        .map-area-box .area-info-text {
            color: #4a9eff;
            font-size: 9px;
            font-weight: normal;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
            max-width: 100%;
            margin-top: 2px;
        }

        /* Floor label styles */
        .floor-label {
            position: absolute;
            color: #4a9eff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 5;
            display: none; /* Hidden by default, shown via JavaScript */
        }

        .area-box:hover {
            background-color: rgba(139, 0, 0, 0.3);
        }

        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #8b0000;
            border: 1px solid #ffffff;
            cursor: nwse-resize;
        }

        .resize-handle.nw {
            top: -5px;
            left: -5px;
            cursor: nwse-resize;
        }

        .resize-handle.ne {
            top: -5px;
            right: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.sw {
            bottom: -5px;
            left: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.se {
            bottom: -5px;
            right: -5px;
            cursor: nwse-resize;
        }

        .coordinates-display {
            position: fixed;
            top: 80px;
            right: 20px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            min-width: 200px;
            z-index: 1000;
            display: none; /* Hidden - set to 'block' to show for coordinate editing */
        }

        .coordinates-display h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .coordinates-display p {
            color: #b0b0b0;
            font-size: 12px;
            margin: 5px 0;
            font-family: monospace;
        }

        .coordinates-display button {
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #3d3d3d;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .coordinates-display button:hover {
            background-color: #4d4d4d;
        }

        .edit-tools {
            margin-top: 8px;
            display: none;
            gap: 8px;
            flex-direction: column;
        }

        .edit-tools button {
            padding: 8px 12px;
            background-color: #3d3d3d;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .edit-tools button:hover {
            background-color: #4d4d4d;
        }

        .edit-tools button.active {
            border-color: #ffd700;
            color: #ffd700;
        }

        .edit-tools .edit-status {
            color: #b0b0b0;
            font-size: 11px;
            line-height: 1.35;
        }

        /* Mobile view */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #404040;
                padding: 8px 10px;
                display: flex;
                flex-direction: row;
                gap: 10px;
                overflow-x: auto;
                flex-shrink: 0;
                align-items: stretch;
            }

            .sidebar-section {
                display: flex;
                flex-direction: column;
                gap: 0;
                flex: 1;
                min-width: 0;
                overflow-y: auto;
                max-height: 350px;
                align-items: flex-start;
            }

            .sidebar-section.areas-section {
                align-items: flex-start;
            }

            .sidebar-section.colordesc-section {
                align-items: flex-start;
            }

            .area-item {
                padding: 10px 12px;
                white-space: nowrap;
                border-left: 3px solid transparent;
                border-bottom: none;
                font-size: 18px;
                line-height: 1.2;
                height: 44px;
                display: flex;
                align-items: center;
                box-sizing: border-box;
            }

            .area-item:hover {
                border-left-color: #505050;
                border-bottom-color: transparent;
            }

            .area-item.active {
                border-left-color: #FFD700;
                border-bottom-color: transparent;
            }

            .area-item.active.floor1 {
                border-left-color: #ff4444;
            }

            .color-desc-item {
                padding: 10px 12px;
                white-space: nowrap;
                border-left: 3px solid transparent;
                border-bottom: none;
                font-size: 18px;
                line-height: 1.2;
                height: 44px;
                display: flex;
                align-items: center;
                box-sizing: border-box;
            }

            .color-desc-item:hover {
                border-left-color: #505050;
                border-bottom-color: transparent;
            }

            .color-desc-item.active {
                border-left-color: #4a9eff;
                border-bottom-color: transparent;
            }

            .content-area {
                padding: 10px;
                flex: 1;
                overflow: visible;
                flex-direction: column;
            }

            .info-area {
                width: 100%;
                max-height: none;
                margin-top: 10px;
                overflow-y: visible;
            }

            .file-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <h1>StockFinder <a class="title-detail-link" href="mobile-map/index.html">detail map</a></h1>
    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="file-container">
                <input type="file" id="fileInput" accept=".json" style="display: none;" />
                <button id="openFileBtn" style="padding: 8px 12px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 8px;">Open export.json</button>
                <input type="file" id="coordinatesFileInput" accept=".json" style="display: none;" />
                <button id="openCoordinatesBtn" style="padding: 8px 12px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px; width: 100%;">Open coordinates.json</button>
                <div class="edit-tools" id="editTools">
                    <button id="toggleEditModeBtn">Edit mode: OFF</button>
                    <button id="addBoxToSelectedBtn">Add box to selected area</button>
                    <button id="deleteSelectedBoxBtn">Delete selected box</button>
                    <button id="saveActiveFloorBtn">Save active floor JSON</button>
                    <div class="edit-status" id="editStatus">Local edit tools. GitHub Pages peal peidetud.</div>
                </div>
            </div>
        </div>
        <div class="content-area">
            <div class="map-container" id="mapContainer">
                <img src="map_2floor.jpg" alt="Map" class="map-image" id="mapImage" />
                <div class="floor-label top-left" id="floorLabelTopLeft"></div>
                <div class="floor-label bottom-right" id="floorLabelBottomRight"></div>
                <div class="area-box" id="areaBox">
                    <div class="resize-handle nw"></div>
                    <div class="resize-handle ne"></div>
                    <div class="resize-handle sw"></div>
                    <div class="resize-handle se"></div>
                </div>
            </div>
            <div class="info-area" id="infoArea">
                <h3>Area Info</h3>
                <div id="infoContent"></div>
                <div class="search-section">
                    <div class="search-box-container">
                        <input type="text" id="keySearchInput" class="search-input" placeholder="Search key or ID (e.g., A3, 111.222.33)" />
                        <button id="searchBtn" class="search-button">Search</button>
                    </div>
                    <div class="search-example">ex: 805.481.85 or B22 or AC14</div>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
            <div class="coordinates-display" id="coordinatesDisplay">
                <h3>Area Box Coordinates</h3>
                <p>X: <span id="coordX">0</span>px</p>
                <p>Y: <span id="coordY">0</span>px</p>
                <p>Width: <span id="coordWidth">0</span>px</p>
                <p>Height: <span id="coordHeight">0</span>px</p>
                <p>Relative X: <span id="coordRelX">0</span>%</p>
                <p>Relative Y: <span id="coordRelY">0</span>%</p>
                <p>Relative Width: <span id="coordRelWidth">0</span>%</p>
                <p>Relative Height: <span id="coordRelHeight">0</span>%</p>
                <button id="copyCoordsBtn">Copy Coordinates</button>
            </div>
        </div>
    </div>

    <script>
        let data = {};
        let currentArea = '';
        let areasList = [];
        let coordinatesData = {};
        let areaToCoordinateMap = {}; // Maps Area1 -> ABCD, Area2 -> EFGHi, etc.
        let uniqueColorDescs = []; // All unique colorDesc values from entire JSON
        let selectedColorDescs = new Set(); // Selected colorDesc filters
        let currentMap = 'map_2floor.jpg'; // Current map image (default: floor2)
        let editModeEnabled = false;
        let selectedEditableCoordinateKey = '';
        let selectedEditableBoxIndex = 0;
        let activeMapEditInteraction = null;
        
        // Hardcoded: Area9, Area10, Area11 are on floor1 (map_1floor.jpg)
        // Displays2 is also on floor1
        function isFloor1Area(area) {
            return area === 'Area9' || area === 'Area10' || area === 'Area11' || area === 'Displays2';
        }
        
        // Get map for area
        function getMapForArea(area) {
            return isFloor1Area(area) ? 'map_1floor.jpg' : 'map_2floor.jpg';
        }

        function isDisplayCoordinateKey(coordinateKey) {
            return typeof coordinateKey === 'string' && coordinateKey.startsWith('Displays');
        }

        function indexToAlphaLabel(index) {
            let value = Math.max(0, index);
            let label = '';
            do {
                label = String.fromCharCode(65 + (value % 26)) + label;
                value = Math.floor(value / 26) - 1;
            } while (value >= 0);
            return label;
        }

        function getDefaultDisplayBoxName(index) {
            return `displays_${indexToAlphaLabel(index)}`;
        }

        function setEditStatus(message) {
            const statusEl = document.getElementById('editStatus');
            if (statusEl) {
                statusEl.textContent = message;
            }
        }

        function refreshEditModeUI() {
            const toggleBtn = document.getElementById('toggleEditModeBtn');
            if (toggleBtn) {
                toggleBtn.textContent = `Edit mode: ${editModeEnabled ? 'ON' : 'OFF'}`;
                toggleBtn.classList.toggle('active', editModeEnabled);
            }

            if (mapContainer) {
                mapContainer.classList.toggle('edit-mode', isLocal() && editModeEnabled);
            }
        }

        function selectEditableMapBox(box) {
            const allBoxes = mapContainer ? mapContainer.querySelectorAll('.map-area-box') : [];
            allBoxes.forEach(item => item.classList.remove('selected'));

            if (!box) {
                selectedEditableCoordinateKey = '';
                selectedEditableBoxIndex = 0;
                setEditStatus(editModeEnabled ? 'Edit mode active. Select a visible area box.' : 'Local edit tools. GitHub Pages peal peidetud.');
                return;
            }

            box.classList.add('selected');
            selectedEditableCoordinateKey = box.dataset.coordinateKey || '';
            selectedEditableBoxIndex = parseInt(box.dataset.boxIndex || '0', 10) || 0;
            const label = box.dataset.coordinateKey || box.dataset.areaName || 'unknown';
            const boxNo = selectedEditableBoxIndex + 1;
            setEditStatus(`Selected: ${label} #${boxNo} (${currentMap === 'map_1floor.jpg' ? '1st floor' : '2nd floor'})`);
        }

        function getCoordinateBoxes(entry) {
            if (!entry) return [];
            if (Array.isArray(entry.boxes) && entry.boxes.length > 0) {
                return entry.boxes;
            }

            const hasSingleBox = ['x', 'y', 'width', 'height', 'relX', 'relY', 'relWidth', 'relHeight']
                .every(prop => typeof entry[prop] !== 'undefined');

            return hasSingleBox ? [entry] : [];
        }

        function ensureDisplayBoxNames(entry, coordinateKey) {
            if (!entry || !isDisplayCoordinateKey(coordinateKey) || !Array.isArray(entry.boxes)) {
                return;
            }

            entry.boxes.forEach((box, index) => {
                if (!box || typeof box !== 'object') return;
                if (!box.name || String(box.name).trim() === '') {
                    box.name = getDefaultDisplayBoxName(index);
                }
            });
        }

        function convertEntryToMultiBox(entry) {
            if (!entry) return null;
            if (Array.isArray(entry.boxes)) {
                return entry.boxes;
            }

            const boxes = [];
            const singleBoxes = getCoordinateBoxes(entry);
            if (singleBoxes.length > 0) {
                const source = singleBoxes[0];
                boxes.push({
                    x: source.x,
                    y: source.y,
                    width: source.width,
                    height: source.height,
                    relX: source.relX,
                    relY: source.relY,
                    relWidth: source.relWidth,
                    relHeight: source.relHeight
                });
            }

            entry.boxes = boxes;
            delete entry.x;
            delete entry.y;
            delete entry.width;
            delete entry.height;
            delete entry.relX;
            delete entry.relY;
            delete entry.relWidth;
            delete entry.relHeight;
            return entry.boxes;
        }

        function getImageBoundsInContainer() {
            if (!mapImage || !mapContainer) return null;

            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            if (!imgRect.width || !imgRect.height) return null;

            return {
                imgRect,
                containerRect,
                imgLeft: imgRect.left - containerRect.left,
                imgTop: imgRect.top - containerRect.top
            };
        }

        function syncCoordinatesDataFromMapBox(box) {
            const coordinateKey = box?.dataset?.coordinateKey;
            if (!coordinateKey || !coordinatesData[coordinateKey]) return;
            const boxIndex = parseInt(box?.dataset?.boxIndex || '0', 10) || 0;

            const bounds = getImageBoundsInContainer();
            if (!bounds) return;

            const { imgRect, containerRect, imgLeft, imgTop } = bounds;
            const boxRect = box.getBoundingClientRect();

            const absX = Math.round(boxRect.left - containerRect.left);
            const absY = Math.round(boxRect.top - containerRect.top);
            const absWidth = Math.round(boxRect.width);
            const absHeight = Math.round(boxRect.height);

            const relX = Number((((absX - imgLeft) / imgRect.width) * 100).toFixed(2));
            const relY = Number((((absY - imgTop) / imgRect.height) * 100).toFixed(2));
            const relWidth = Number(((absWidth / imgRect.width) * 100).toFixed(2));
            const relHeight = Number(((absHeight / imgRect.height) * 100).toFixed(2));

            const entry = coordinatesData[coordinateKey];
            let target = entry;

            if (Array.isArray(entry.boxes)) {
                if (!entry.boxes[boxIndex]) {
                    entry.boxes[boxIndex] = {};
                }
                target = entry.boxes[boxIndex];
            }

            target.x = absX;
            target.y = absY;
            target.width = absWidth;
            target.height = absHeight;
            target.relX = relX;
            target.relY = relY;
            target.relWidth = relWidth;
            target.relHeight = relHeight;

            setEditStatus(`${coordinateKey} #${boxIndex + 1}: X ${absX}, Y ${absY}, W ${absWidth}, H ${absHeight}`);
        }

        function startMapBoxEdit(e, box) {
            if (!isLocal() || !editModeEnabled || !box) return;

            const handle = e.target.closest('.map-box-resize-handle');
            const bounds = getImageBoundsInContainer();
            if (!bounds) return;

            const { containerRect } = bounds;
            const boxRect = box.getBoundingClientRect();

            selectEditableMapBox(box);

            activeMapEditInteraction = {
                mode: handle ? 'resize' : 'drag',
                handle: handle ? handle.dataset.handle : '',
                box,
                startX: e.clientX,
                startY: e.clientY,
                startLeft: boxRect.left - containerRect.left,
                startTop: boxRect.top - containerRect.top,
                startWidth: boxRect.width,
                startHeight: boxRect.height
            };

            document.body.style.userSelect = 'none';
            e.preventDefault();
            e.stopPropagation();
        }

        function onMapBoxEditMove(e) {
            if (!activeMapEditInteraction || !isLocal() || !editModeEnabled) return;

            const bounds = getImageBoundsInContainer();
            if (!bounds) return;
            const { imgRect, imgLeft, imgTop } = bounds;

            const interaction = activeMapEditInteraction;
            const box = interaction.box;
            if (!box) return;

            const deltaX = e.clientX - interaction.startX;
            const deltaY = e.clientY - interaction.startY;

            let newLeft = interaction.startLeft;
            let newTop = interaction.startTop;
            let newWidth = interaction.startWidth;
            let newHeight = interaction.startHeight;

            const minSize = 30;
            const maxRight = imgLeft + imgRect.width;
            const maxBottom = imgTop + imgRect.height;

            if (interaction.mode === 'drag') {
                newLeft = interaction.startLeft + deltaX;
                newTop = interaction.startTop + deltaY;

                newLeft = Math.max(imgLeft, Math.min(newLeft, maxRight - interaction.startWidth));
                newTop = Math.max(imgTop, Math.min(newTop, maxBottom - interaction.startHeight));
            } else {
                const handle = interaction.handle;

                if (handle === 'se') {
                    newWidth = interaction.startWidth + deltaX;
                    newHeight = interaction.startHeight + deltaY;
                } else if (handle === 'sw') {
                    newWidth = interaction.startWidth - deltaX;
                    newHeight = interaction.startHeight + deltaY;
                    newLeft = interaction.startLeft + (interaction.startWidth - newWidth);
                } else if (handle === 'ne') {
                    newWidth = interaction.startWidth + deltaX;
                    newHeight = interaction.startHeight - deltaY;
                    newTop = interaction.startTop + (interaction.startHeight - newHeight);
                } else if (handle === 'nw') {
                    newWidth = interaction.startWidth - deltaX;
                    newHeight = interaction.startHeight - deltaY;
                    newLeft = interaction.startLeft + (interaction.startWidth - newWidth);
                    newTop = interaction.startTop + (interaction.startHeight - newHeight);
                }

                if (newWidth < minSize) {
                    if (handle === 'sw' || handle === 'nw') {
                        newLeft -= (minSize - newWidth);
                    }
                    newWidth = minSize;
                }
                if (newHeight < minSize) {
                    if (handle === 'ne' || handle === 'nw') {
                        newTop -= (minSize - newHeight);
                    }
                    newHeight = minSize;
                }

                if (newLeft < imgLeft) {
                    newWidth -= (imgLeft - newLeft);
                    newLeft = imgLeft;
                }
                if (newTop < imgTop) {
                    newHeight -= (imgTop - newTop);
                    newTop = imgTop;
                }

                if (newLeft + newWidth > maxRight) {
                    newWidth = maxRight - newLeft;
                }
                if (newTop + newHeight > maxBottom) {
                    newHeight = maxBottom - newTop;
                }

                newWidth = Math.max(minSize, newWidth);
                newHeight = Math.max(minSize, newHeight);
            }

            box.style.left = `${newLeft}px`;
            box.style.top = `${newTop}px`;
            box.style.width = `${newWidth}px`;
            box.style.height = `${newHeight}px`;

            syncCoordinatesDataFromMapBox(box);
            e.preventDefault();
        }

        function addBoxToSelectedArea() {
            if (!isLocal()) return;
            if (!editModeEnabled) {
                alert('Lülita Edit mode sisse.');
                return;
            }
            if (!selectedEditableCoordinateKey) {
                alert('Vali kõigepealt kaartil kast.');
                return;
            }

            const entry = coordinatesData[selectedEditableCoordinateKey];
            if (!entry) {
                alert('Valitud ala koordinaate ei leitud.');
                return;
            }
            if (entry.map !== currentMap) {
                alert('Valitud ala ei kuulu aktiivsele korrusele.');
                return;
            }

            const boxes = convertEntryToMultiBox(entry);
            if (!boxes) return;

            const source = boxes[selectedEditableBoxIndex] || boxes[0];
            if (!source) {
                alert('Valitud alal puudub alus-kast kopeerimiseks.');
                return;
            }

            const newBox = {
                x: Math.round((source.x ?? 0) + 12),
                y: Math.round((source.y ?? 0) + 12),
                width: Math.round(source.width ?? 80),
                height: Math.round(source.height ?? 50),
                relX: Number(source.relX ?? 0),
                relY: Number(source.relY ?? 0),
                relWidth: Number(source.relWidth ?? 0),
                relHeight: Number(source.relHeight ?? 0)
            };
            if (isDisplayCoordinateKey(selectedEditableCoordinateKey)) {
                newBox.name = getDefaultDisplayBoxName(boxes.length);
            }

            const bounds = getImageBoundsInContainer();
            if (bounds) {
                const { imgRect, imgLeft, imgTop } = bounds;
                newBox.relX = Number((((newBox.x - imgLeft) / imgRect.width) * 100).toFixed(2));
                newBox.relY = Number((((newBox.y - imgTop) / imgRect.height) * 100).toFixed(2));
                newBox.relWidth = Number(((newBox.width / imgRect.width) * 100).toFixed(2));
                newBox.relHeight = Number(((newBox.height / imgRect.height) * 100).toFixed(2));
            }

            boxes.push(newBox);
            selectedEditableBoxIndex = boxes.length - 1;
            updateAreaBoxes();
            setEditStatus(`Added new box to ${selectedEditableCoordinateKey} (now ${boxes.length} boxes).`);
        }

        function deleteSelectedBox() {
            if (!isLocal()) return;
            if (!editModeEnabled) {
                alert('Lülita Edit mode sisse.');
                return;
            }
            if (!selectedEditableCoordinateKey) {
                alert('Vali kustutatav kast.');
                return;
            }

            const entry = coordinatesData[selectedEditableCoordinateKey];
            if (!entry) return;

            if (!Array.isArray(entry.boxes)) {
                alert('Sellel alal on hetkel ainult üks kast (multi-box pole veel kasutusel).');
                return;
            }

            if (entry.boxes.length <= 1) {
                alert('Viimast kasti ei kustuta.');
                return;
            }

            const removeIndex = Math.min(selectedEditableBoxIndex, entry.boxes.length - 1);
            entry.boxes.splice(removeIndex, 1);
            selectedEditableBoxIndex = Math.max(0, removeIndex - 1);
            updateAreaBoxes();
            setEditStatus(`Removed box from ${selectedEditableCoordinateKey} (remaining ${entry.boxes.length}).`);
        }

        function downloadTextFile(filename, text) {
            const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = filename;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 0);
        }

            }

            const coordinateKeys = Object.keys(coordinatesData || {});
            if (coordinateKeys.length === 0) {
                alert('Lae enne coordinates.json.');

            const activeFloor = currentMap || 'map_2floor.jpg';
            const floorData = {};
            coordinateKeys.forEach(key => {

        // Update floor labels based on current map
        // Teksti asukohad:
        // - topLeftLabel: vasak ülemine nurk (pildi vasak ülemine nurk + 10px offset)
        // - bottomRightLabel: parem alumine nurk (pildi parem alumine nurk + 10px offset)
        // Mõlemal kaardil kuvatakse sama tekst mõlemas nurgas:
        // - map_1floor.jpg: "1st Floor" nii vasakul üleval kui ka paremal all
        // - map_2floor.jpg: "2nd Floor" nii vasakul üleval kui ka paremal all
        function updateFloorLabels() {
            const topLeftLabel = document.getElementById('floorLabelTopLeft');
            const bottomRightLabel = document.getElementById('floorLabelBottomRight');
            
            if (!topLeftLabel || !bottomRightLabel || !mapImage || !mapContainer) return;
            
            // Wait for image to load
            if (!mapImage.complete) {
                mapImage.addEventListener('load', updateFloorLabels);
                return;
            }
            
            // Get image position relative to container
            // imgLeft, imgTop: pildi vasak ülemine nurk konteineri suhtes
            // imgRight, imgBottom: pildi parem alumine nurk konteineri suhtes
            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            
            // Check if image dimensions are valid (layout might not be ready yet)
            if (imgRect.width === 0 || imgRect.height === 0 || containerRect.width === 0 || containerRect.height === 0) {
                // Layout not ready yet, try again on next frame
                requestAnimationFrame(updateFloorLabels);
                return;
            }
            
            const imgLeft = imgRect.left - containerRect.left;
            const imgTop = imgRect.top - containerRect.top;
            const imgRight = imgLeft + imgRect.width;
            const imgBottom = imgTop + imgRect.height;
            
            // Determine text based on current map
            const floorText = currentMap === 'map_1floor.jpg' ? '1st Floor' : '2nd Floor';
            
            // Show both labels with same text
            // Top-left label: vasak ülemine nurk (imgLeft + 10px, imgTop + 10px)
            topLeftLabel.textContent = floorText;
            topLeftLabel.style.display = 'block';
            topLeftLabel.style.left = (imgLeft + 10) + 'px';
            topLeftLabel.style.top = (imgTop + 10) + 'px';
            topLeftLabel.style.right = 'auto';
            topLeftLabel.style.bottom = 'auto';
            
            // Bottom-right label: parem alumine nurk
            // Kasutame right ja bottom, et tekst oleks pildi paremast alamisest nurgast 10px kaugusel
            bottomRightLabel.textContent = floorText;
            bottomRightLabel.style.display = 'block';
            bottomRightLabel.style.left = 'auto';
            bottomRightLabel.style.top = 'auto';
            // right: konteineri parem serv - pildi parem serv + 10px offset
            bottomRightLabel.style.right = (containerRect.width - imgRight + 10) + 'px';
            // bottom: konteineri alumine serv - pildi alumine serv + 10px offset
            bottomRightLabel.style.bottom = (containerRect.height - imgBottom + 10) + 'px';
        }

        // Check if running locally (file://) or on GitHub Pages
        function isLocal() {
            return window.location.protocol === 'file:' || 
                   window.location.hostname === '' || 
                   window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1';
        }

        // Load JSON file automatically from GitHub Pages
        async function loadData() {
            // Only auto-load if on GitHub Pages
            if (!isLocal()) {
                try {
                    const response = await fetch('export.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    let text = await response.text();
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    extractAreas();
                    renderSidebar();
                    // Update floor labels after sidebar render (layout might have changed)
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            updateFloorLabels();
                        });
                    });
                    // Auto-select first area if available
                    if (areasList.length > 0) {
                        selectArea(areasList[0]);
                    }
                } catch (error) {
                    console.error('Error loading JSON:', error);
                }
            }
        }

        // Load JSON from local file using File API
        function loadLocalFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    extractAreas();
                    renderSidebar();
                    // Don't auto-load coordinates in local mode - user must click button
                    // If coordinates are already loaded, update mapping and sidebar
                    if (Object.keys(coordinatesData).length > 0) {
                        createAreaCoordinateMapping();
                        renderSidebar();
                    }
                    // Update floor labels after sidebar render (layout might have changed)
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            updateFloorLabels();
                        });
                    });
                    // Auto-select first area if available
                    if (areasList.length > 0) {
                        selectArea(areasList[0]);
                    }
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                    alert('Error parsing JSON file: ' + error.message);
                }
            };
            reader.onerror = function() {
                console.error('Error reading file.');
                alert('Error reading file.');
            };
            reader.readAsText(file);
        }

        // Extract unique areas and colorDescs from data
        function extractAreas() {
            const areasSet = new Set();
            const colorDescSet = new Set();
            
            for (const key in data) {
                const area = data[key]?.area;
                const colorDesc = data[key]?.colorDesc;
                
                if (area) {
                    areasSet.add(area);
                }
                
                if (colorDesc) {
                    colorDescSet.add(colorDesc);
                }
            }
            
            areasList = Array.from(areasSet).sort((a, b) => {
                // Sort areas: Area1, Area2, Area3, etc.
                const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                return aNum - bNum;
            });
            
            // Sort colorDescs alphabetically
            uniqueColorDescs = Array.from(colorDescSet).sort();
            
            console.log('Areas:', areasList);
            console.log('Unique colorDescs:', uniqueColorDescs);
        }

        // Render sidebar with areas and colorDesc items
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            // Keep file-container, remove only area items and colorDesc items
            const existingItems = sidebar.querySelectorAll('.area-item, .color-desc-item, .sidebar-section');
            // Store active state before removing
            const activeAreas = new Set();
            const activeColorDescs = new Set();
            existingItems.forEach(item => {
                if (item.classList.contains('active')) {
                    if (item.classList.contains('color-desc-item')) {
                        activeColorDescs.add(item.dataset.colorDesc);
                    } else if (item.classList.contains('area-item')) {
                        // Extract area name (without coordinate part if present)
                        const text = item.textContent;
                        const areaMatch = text.match(/^(Area\d+)/);
                        if (areaMatch) {
                            activeAreas.add(areaMatch[1]);
                        }
                    }
                }
                item.remove();
            });

            // Check if mobile view
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            
            if (isMobile) {
                // Mobile view: create two sections side by side
                const areasSection = document.createElement('div');
                areasSection.className = 'sidebar-section areas-section';
                
                const colordescSection = document.createElement('div');
                colordescSection.className = 'sidebar-section colordesc-section';
                
                // Render areas in left section (all areas, can be longer than colorDesc)

                    const areaItem = document.createElement('div');
                    areaItem.className = 'area-item';
                    
                    // Add floor1 class for floor1 areas (Area9, Area10, Area11, Displays2)

                        areaItem.dataset.areaName = area;

                    }
                    
                    areaItem.addEventListener('click', () => selectArea(area));

                // Render colorDesc items in right section

                        selectedColorDescs.add(colorDesc);
                    }
                    
                    colorDescItem.addEventListener('click', () => selectColorDesc(colorDesc));
                    colordescSection.appendChild(colorDescItem);
                }
                
                // Add empty items to align rows if areas count > colorDescs count
                const areasCount = areasList.length;
                const colorDescsCount = uniqueColorDescs.length;
                if (areasCount > colorDescsCount) {
                    for (let i = colorDescsCount; i < areasCount; i++) {

                        emptyItem.style.visibility = 'hidden'; // Invisible but takes up space
                        emptyItem.style.pointerEvents = 'none'; // Not clickable
                        colordescSection.appendChild(emptyItem);
                    }
                }
                
                sidebar.appendChild(areasSection);
                sidebar.appendChild(colordescSection);
            } else {
                // Desktop view: render vertically as before
                for (const area of areasList) {
                    const areaItem = document.createElement('div');
                    areaItem.className = 'area-item';
                    
                    // Add floor1 class for floor1 areas (Area9, Area10, Area11, Displays2)
                    if (isFloor1Area(area)) {
                        areaItem.classList.add('floor1');
                    }
                    
                    const coordinateKey = areaToCoordinateMap[area];
                    if (coordinateKey) {
                        areaItem.textContent = `${area} (${coordinateKey})`;
                        areaItem.dataset.areaName = area;

                        areaItem.dataset.areaName = area;

                        areaItem.classList.add('active');

        // Select/deselect colorDesc (toggle)
        function selectColorDesc(colorDesc) {
            // Clear search results
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.classList.remove('active');
                searchResults.innerHTML = '';
            }
            
            // Deactivate all areas when colorDesc is selected
            const areaItems = document.querySelectorAll('.area-item');
            areaItems.forEach(item => {
                item.classList.remove('active');
            });
            
            if (selectedColorDescs.has(colorDesc)) {
                selectedColorDescs.delete(colorDesc);
                console.log('Deselected colorDesc:', colorDesc);
            } else {
                // Clear other colorDescs and select only this one
                selectedColorDescs.clear();
                selectedColorDescs.add(colorDesc);
                console.log('Selected colorDesc:', colorDesc);
            }
            
            // Update UI for all colorDesc items
            const colorDescItems = document.querySelectorAll('.color-desc-item');
            colorDescItems.forEach(item => {
                if (selectedColorDescs.has(item.dataset.colorDesc)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // Update area boxes based on colorDesc filter
            updateAreaBoxes();
            // Update info area

        // Select/deselect area (toggle)
        function selectArea(area) {
            // Clear search results
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.classList.remove('active');
                searchResults.innerHTML = '';
            }
            
            // Deactivate all colorDescs when area is selected
            selectedColorDescs.clear();
            const colorDescItems = document.querySelectorAll('.color-desc-item');
            colorDescItems.forEach(item => {
                item.classList.remove('active');
            });
            
            const areaItems = document.querySelectorAll('.area-item');
            // Find by data attribute (original area name) or text content
            const clickedItem = Array.from(areaItems).find(item => 
                item.dataset.areaName === area || item.textContent.includes(area)
            );
            
            if (clickedItem) {
                // Toggle active state
                if (clickedItem.classList.contains('active')) {
                    clickedItem.classList.remove('active');
                    console.log('Deselected area:', area);
                } else {
                    clickedItem.classList.add('active');
                    console.log('Selected area:', area);
                }
            }
            
            // Get all active areas
            const activeAreas = Array.from(areaItems)
                .filter(item => item.classList.contains('active'))
                .map(item => item.dataset.areaName || item.textContent.split(' ')[0]);
            
            // Check if selected area is floor1 or floor2
            const selectedAreaMap = getMapForArea(area);
            
            // If selecting an area, deselect all areas from different floor
            if (clickedItem && clickedItem.classList.contains('active')) {
                const otherFloorAreas = activeAreas.filter(a => getMapForArea(a) !== selectedAreaMap);
                otherFloorAreas.forEach(otherArea => {
                    const otherItem = Array.from(areaItems).find(item => 
                        item.dataset.areaName === otherArea || item.textContent.includes(otherArea)
                    );
                    if (otherItem) {
                        otherItem.classList.remove('active');
                        console.log('Deselected area from different floor:', otherArea);
                    }
                });
                
                // Update map image if needed
                if (currentMap !== selectedAreaMap) {
                    currentMap = selectedAreaMap;
                    mapImage.src = currentMap;
                    updateFloorLabels();
                    console.log('Changed map to:', currentMap);
                }
            }
            
            // Update currentArea to last selected area (for potential future use)
            const finalActiveAreas = Array.from(areaItems)
                .filter(item => item.classList.contains('active'))
                .map(item => item.dataset.areaName || item.textContent.split(' ')[0]);
            
            if (finalActiveAreas.length > 0) {
                currentArea = finalActiveAreas[finalActiveAreas.length - 1]; // Last selected
                // Update map based on active areas
                const activeMap = getMapForArea(currentArea);
                if (currentMap !== activeMap) {
                    currentMap = activeMap;
                    mapImage.src = currentMap;
                    updateFloorLabels();
                    console.log('Changed map to:', currentMap);
                }
            } else {
                currentArea = '';
            }
            // Update area boxes on map
            updateAreaBoxes();
            // Update info area
            updateInfoArea();
        }

        // Load coordinates from local file
        function loadLocalCoordinates(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    coordinatesData = JSON.parse(text);
                    console.log('Coordinates loaded:', coordinatesData);
                    // Create mapping: Area1 -> first key, Area2 -> second key, etc.
                    createAreaCoordinateMapping();
                    // Update sidebar to show coordinate names
                    renderSidebar();
                    // Update floor labels after sidebar render (layout might have changed)
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            updateFloorLabels();
                        });
                    });
                    // Wait a bit for image to be ready, then update boxes
                    setTimeout(() => {
                        updateAreaBoxes();
                        updateInfoArea();
                    }, 100);
                } catch (error) {
                    console.error('Error parsing coordinates JSON:', error);
                    alert('Error parsing coordinates JSON file: ' + error.message);
                }
            };
            reader.onerror = function() {
                console.error('Error reading coordinates file.');
                alert('Error reading coordinates file.');
            };
            reader.readAsText(file);
        }

        // Create mapping between areas (Area1, Area2, etc.) and coordinate keys (ABCD, EFGHi, etc.)
        function createAreaCoordinateMapping() {
            areaToCoordinateMap = {};
            const coordinateKeys = Object.keys(coordinatesData);
            console.log('Coordinate keys in order:', coordinateKeys);
            
            // Add Displays1 and Displays2 to areasList if they exist in coordinates but not in export.json
            const displaysAreas = ['Displays1', 'Displays2'];
            displaysAreas.forEach(displayArea => {
                if (coordinateKeys.includes(displayArea) && !areasList.includes(displayArea)) {
                    areasList.push(displayArea);
                    console.log(`Added ${displayArea} to areasList (not in export.json)`);
                }
            });
            
            // Re-sort areasList to match coordinates.json order
            // Create a new sorted list based on coordinateKeys order
            const sortedAreasList = [];
            const regularAreasForSort = areasList.filter(a => a !== 'Displays1' && a !== 'Displays2');
            let regularAreaIndexForSort = 0;
            
            // Build sorted list following coordinateKeys order
            for (let i = 0; i < coordinateKeys.length; i++) {
                const coordinateKey = coordinateKeys[i];
                
                // If this is a Displays area, add it directly
                if (coordinateKey === 'Displays1' || coordinateKey === 'Displays2') {
                    if (areasList.includes(coordinateKey)) {
                        sortedAreasList.push(coordinateKey);
                    }
                } else if (regularAreaIndexForSort < regularAreasForSort.length) {
                    // For regular areas, add them in order
                    sortedAreasList.push(regularAreasForSort[regularAreaIndexForSort]);
                    regularAreaIndexForSort++;
                }
            }
            
            // Replace areasList with sorted version
            areasList = sortedAreasList;
            console.log('Sorted areasList:', areasList);
            
            // Map each coordinate key to corresponding area by index
            // Filter out Displays areas from areasList for regular mapping
            const regularAreas = areasList.filter(a => a !== 'Displays1' && a !== 'Displays2');
            let regularAreaIndex = 0;
            
            for (let i = 0; i < coordinateKeys.length; i++) {
                const coordinateKey = coordinateKeys[i];
                
                // If this coordinate key is Displays1 or Displays2, use it directly
                if (coordinateKey === 'Displays1' || coordinateKey === 'Displays2') {
                    areaToCoordinateMap[coordinateKey] = coordinateKey;
                    console.log(`Mapped ${coordinateKey} -> ${coordinateKey} (display area)`);
                } else if (regularAreaIndex < regularAreas.length) {
                    // For regular areas, map from regularAreas list
                    const areaName = regularAreas[regularAreaIndex];
                    areaToCoordinateMap[areaName] = coordinateKey;
                    console.log(`Mapped ${areaName} -> ${coordinateKey}`);
                    regularAreaIndex++;
                }
            }
        }

        // Update info area with active areas information
        function updateInfoArea() {
            const infoContent = document.getElementById('infoContent');
            const infoArea = document.getElementById('infoArea');
            if (!infoContent) {
                console.log('infoContent element not found');
                return;
            }

            // Update header based on selected mode
            if (infoArea) {
                const header = infoArea.querySelector('h3');
                if (header) {
                    if (selectedColorDescs.size > 0) {
                        // ColorDesc mode: show selected colorDesc in header
                        const colorDescArray = Array.from(selectedColorDescs);
                        // Make colorDesc words blue
                        const colorDescsHtml = colorDescArray.map(desc => 
                            `<span style="color: #4a9eff;">${desc}</span>`
                        ).join(', ');
                        header.innerHTML = `Area Info, ${colorDescsHtml}`;
                    } else {
                        // Area mode: show default header
                        header.textContent = 'Area Info';
                    }
                }
            }

            // Clear existing content
            infoContent.innerHTML = '';

            // Get active areas (same logic as updateAreaBoxes)
            let areasToShow = [];
            
            if (selectedColorDescs.size > 0) {
                // ColorDesc mode: show all areas that have the selected colorDesc
                const areasWithColorDesc = new Set();
                for (const key in data) {
                    const item = data[key];
                    if (item?.area && selectedColorDescs.has(item?.colorDesc)) {
                        areasWithColorDesc.add(item.area);
                    }
                }
                areasToShow = Array.from(areasWithColorDesc).sort((a, b) => {
                    const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                    const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                    return aNum - bNum;
                });
            } else {
                // Area mode: show only active areas
                const areaItems = document.querySelectorAll('.area-item');
                areasToShow = Array.from(areaItems)
                    .filter(item => item.classList.contains('active'))
                    .map(item => item.dataset.areaName || item.textContent.split(' ')[0]);
            }

            if (areasToShow.length === 0) {
                return;
            }

            // Process each area
            areasToShow.forEach(areaName => {
                // Check if this is a display area (no data in export.json)
                const isDisplayArea = areaName === 'Displays1' || areaName === 'Displays2';
                
                // Get all keys for this area, filtered by colorDesc if selected
                const areaKeys = [];
                for (const key in data) {
                    const item = data[key];
                    if (item?.area === areaName) {
                        // If colorDesc is selected, filter by colorDesc
                        if (selectedColorDescs.size > 0) {
                            if (selectedColorDescs.has(item?.colorDesc)) {
                                areaKeys.push(key);
                            }
                        } else {
                            // No colorDesc filter, include all keys
                            areaKeys.push(key);
                        }
                    }
                }
                
                // If this is a display area and has no data, show empty info
                if (isDisplayArea && areaKeys.length === 0) {
                    // Get coordinate key for display
                    const coordinateKey = areaToCoordinateMap[areaName] || '';
                    const coordinateDisplay = coordinateKey ? ` (${coordinateKey})` : '';
                    
                    // Create section
                    const section = document.createElement('div');
                    section.className = 'info-area-section';
                    
                    // Create title
                    const title = document.createElement('div');
                    title.className = 'info-area-section-title';
                    title.textContent = `${areaName}${coordinateDisplay} (Display area - no data)`;
                    section.appendChild(title);
                    
                    infoContent.appendChild(section);
                    return; // Skip further processing for display areas without data
                }
                
                // If regular area has no keys, skip it
                if (areaKeys.length === 0) {
                    return;
                }

                // Group by letter prefix and find continuous ranges
                // Keys can be "A1", "AB1", "AC22", "i1", etc. (supports both uppercase and lowercase)
                const letterRanges = {};
                areaKeys.forEach(key => {
                    // Extract letters and number from key using regex
                    // Match: letters at start (uppercase or lowercase), then numbers
                    const match = key.match(/^([A-Za-z]+)(\d+)$/);
                    if (!match) {
                        console.warn(`Invalid key format: ${key}`);
                        return;
                    }
                    
                    const letterPrefix = match[1]; // "A", "AB", "AC", "i", etc.
                    const number = parseInt(match[2], 10); // 1, 22, etc.
                    
                    if (!letterRanges[letterPrefix]) {
                        letterRanges[letterPrefix] = [];
                    }
                    letterRanges[letterPrefix].push(number);
                });

                // Find continuous ranges for each letter
                const letterInfo = {};
                Object.keys(letterRanges).forEach(letter => {
                    const numbers = letterRanges[letter].sort((a, b) => a - b);
                    const ranges = [];
                    let rangeStart = numbers[0];
                    let rangeEnd = numbers[0];
                    
                    for (let i = 1; i < numbers.length; i++) {
                        if (numbers[i] === rangeEnd + 1) {
                            // Continuous, extend range
                            rangeEnd = numbers[i];
                        } else {
                            // Gap found, save current range and start new one
                            ranges.push({ start: rangeStart, end: rangeEnd, count: rangeEnd - rangeStart + 1 });
                            rangeStart = numbers[i];
                            rangeEnd = numbers[i];
                        }
                    }
                    // Don't forget the last range
                    ranges.push({ start: rangeStart, end: rangeEnd, count: rangeEnd - rangeStart + 1 });
                    
                    letterInfo[letter] = ranges;
                });

                // Calculate total
                const total = Object.values(letterInfo).reduce((sum, ranges) => {
                    return sum + ranges.reduce((rangeSum, range) => rangeSum + range.count, 0);
                }, 0);

                // Get coordinate key for display
                const coordinateKey = areaToCoordinateMap[areaName] || '';
                const coordinateDisplay = coordinateKey ? ` (${coordinateKey})` : '';

                // Create section
                const section = document.createElement('div');
                section.className = 'info-area-section';

                // Create title
                const title = document.createElement('div');
                title.className = 'info-area-section-title';
                title.textContent = `${areaName}${coordinateDisplay} (${total} pcs)`;
                section.appendChild(title);

                // Create items for each letter (sorted alphabetically)
                const sortedLetters = Object.keys(letterInfo).sort();
                sortedLetters.forEach(letter => {
                    const ranges = letterInfo[letter];
                    ranges.forEach(range => {
                        const item = document.createElement('div');
                        item.className = 'info-area-item';
                        // Format: C5-14 (first number to last number in continuous range)
                        item.textContent = `${letter}${range.start}-${range.count}`;
                        section.appendChild(item);
                    });
                });

                // Add colorDesc info at the end (only in Area mode, not colorDesc mode)
                if (selectedColorDescs.size === 0) {
                    // Get unique colorDesc values for this area
                    const colorDescsSet = new Set();
                    for (const key in data) {
                        const item = data[key];
                        if (item?.area === areaName && item?.colorDesc) {
                            colorDescsSet.add(item.colorDesc);
                        }
                    }
                    
                    if (colorDescsSet.size > 0) {
                        const colorDescsArray = Array.from(colorDescsSet).sort();
                        const colorDescItem = document.createElement('div');
                        colorDescItem.className = 'info-area-item';
                        colorDescItem.style.marginTop = '10px';
                        colorDescItem.style.fontStyle = 'italic';
                        // Make colorDesc words yellow
                        const colorDescsHtml = colorDescsArray.map(desc => 
                            `<span style="color: #FFD700;">${desc}</span>`
                        ).join(', ');
                        colorDescItem.innerHTML = `Items: ${colorDescsHtml}`;
                        section.appendChild(colorDescItem);
                    }
                }

                infoContent.appendChild(section);
            });
        }
