<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFinder Map (Alpha)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 30px;
            text-align: center;
            padding: 20px 20px 0;
        }

        .file-container {
            padding: 10px 20px;
            border-bottom: 1px solid #404040;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar styles */
        .sidebar {
            width: 250px;
            background-color: #252525;
            border-right: 1px solid #404040;
            padding: 20px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .area-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .area-item:hover {
            background-color: #2d2d2d;
            border-left-color: #505050;
        }

        .area-item.active {
            background-color: #2d2d2d;
            border-left-color: #FFD700;
            color: #ffffff;
            font-weight: bold;
        }

        /* ColorDesc items - same style as area items */
        .color-desc-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            color: #e0e0e0;
            border-left: 3px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .color-desc-item:hover {
            background-color: #2d2d2d;
            border-left-color: #505050;
        }

        .color-desc-item.active {
            background-color: #2d2d2d;
            border-left-color: #4a9eff;
            color: #ffffff;
            font-weight: bold;
        }

        /* Content area with image */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
        }

        .map-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .map-image {
            max-width: 100%;
            max-height: 100%;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Info area */
        .info-area {
            width: 300px;
            background-color: #252525;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            flex-shrink: 0;
        }

        .info-area h3 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }

        .info-area-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #404040;
        }

        .info-area-section:last-child {
            border-bottom: none;
        }

        .info-area-section-title {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .info-area-item {
            color: #e0e0e0;
            font-size: 13px;
            margin: 5px 0;
            padding-left: 10px;
            font-family: monospace;
        }

        /* Search section */
        .search-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #404040;
        }

        .search-box-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 8px 12px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
            font-family: monospace;
        }

        .search-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .search-button {
            padding: 8px 16px;
            background-color: #3d3d3d;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .search-button:hover {
            background-color: #4d4d4d;
        }

        .search-example {
            color: #808080;
            font-size: 10px;
            margin-top: 4px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .search-results {
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .search-result-key {
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .search-result-info {
            color: #b0b0b0;
            font-size: 12px;
            margin: 4px 0;
        }

        .search-result-info strong {
            color: #e0e0e0;
        }

        .search-result-items {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #404040;
        }

        .search-result-item-id {
            color: #e0e0e0;
            font-size: 12px;
            font-family: monospace;
            margin: 3px 0;
            padding-left: 10px;
        }

        .search-no-results {
            color: #b0b0b0;
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        /* Draggable and resizable box - for coordinate editing */
        /* Hidden by default - uncomment or set display: block to show */
        .area-box {
            position: absolute;
            border: 2px solid #8b0000;
            background-color: rgba(139, 0, 0, 0.2);
            cursor: move;
            min-width: 50px;
            min-height: 50px;
            display: none; /* Hidden - set to 'block' to show for coordinate editing */
        }

        /* Area boxes on map - shown based on active areas */
        .map-area-box {
            position: absolute;
            border: 2px solid #4a9eff;
            background-color: rgba(74, 158, 255, 0.3);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-sizing: border-box;
            z-index: 10;
        }

        .map-area-box .area-label {
            color: #4a9eff;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
            max-width: 100%;
        }

        .area-box:hover {
            background-color: rgba(139, 0, 0, 0.3);
        }

        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #8b0000;
            border: 1px solid #ffffff;
            cursor: nwse-resize;
        }

        .resize-handle.nw {
            top: -5px;
            left: -5px;
            cursor: nwse-resize;
        }

        .resize-handle.ne {
            top: -5px;
            right: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.sw {
            bottom: -5px;
            left: -5px;
            cursor: nesw-resize;
        }

        .resize-handle.se {
            bottom: -5px;
            right: -5px;
            cursor: nwse-resize;
        }

        .coordinates-display {
            position: fixed;
            top: 80px;
            right: 20px;
            background-color: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            min-width: 200px;
            z-index: 1000;
            display: none; /* Hidden - set to 'block' to show for coordinate editing */
        }

        .coordinates-display h3 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .coordinates-display p {
            color: #b0b0b0;
            font-size: 12px;
            margin: 5px 0;
            font-family: monospace;
        }

        .coordinates-display button {
            margin-top: 10px;
            padding: 6px 12px;
            background-color: #3d3d3d;
            border: 1px solid #505050;
            border-radius: 4px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
        }

        .coordinates-display button:hover {
            background-color: #4d4d4d;
        }

        /* Mobile view */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #404040;
                padding: 8px 10px;
                display: flex;
                flex-direction: row;
                gap: 10px;
                overflow-x: auto;
                flex-shrink: 0;
            }

            .sidebar-section {
                display: flex;
                flex-direction: column;
                gap: 0;
                flex: 1;
                min-width: 0;
                overflow-y: auto;
                max-height: 350px;
            }

            .sidebar-section.areas-section {
                align-items: flex-start;
            }

            .sidebar-section.colordesc-section {
                align-items: flex-start;
            }

            .area-item {
                padding: 10px 12px;
                white-space: nowrap;
                border-left: 3px solid transparent;
                border-bottom: none;
                font-size: 18px;
                line-height: 1.2;
                min-height: 24px;
                display: flex;
                align-items: center;
            }

            .area-item:hover {
                border-left-color: #505050;
                border-bottom-color: transparent;
            }

            .area-item.active {
                border-left-color: #FFD700;
                border-bottom-color: transparent;
            }

            .color-desc-item {
                padding: 10px 12px;
                white-space: nowrap;
                border-left: 3px solid transparent;
                border-bottom: none;
                font-size: 18px;
                line-height: 1.2;
                min-height: 24px;
                display: flex;
                align-items: center;
            }

            .color-desc-item:hover {
                border-left-color: #505050;
                border-bottom-color: transparent;
            }

            .color-desc-item.active {
                border-left-color: #4a9eff;
                border-bottom-color: transparent;
            }

            .content-area {
                padding: 10px;
                flex: 1;
                overflow: visible;
                flex-direction: column;
            }

            .info-area {
                width: 100%;
                max-height: none;
                margin-top: 10px;
                overflow-y: visible;
            }

            .file-container {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <h1>StockFinder Map (Alpha)</h1>
    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="file-container">
                <input type="file" id="fileInput" accept=".json" style="display: none;" />
                <button id="openFileBtn" style="padding: 8px 12px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px; width: 100%; margin-bottom: 8px;">Open export.json</button>
                <input type="file" id="coordinatesFileInput" accept=".json" style="display: none;" />
                <button id="openCoordinatesBtn" style="padding: 8px 12px; background-color: #3d3d3d; border: 1px solid #505050; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 12px; width: 100%;">Open coordinates.json</button>
            </div>
        </div>
        <div class="content-area">
            <div class="map-container" id="mapContainer">
                <img src="map_2floor.jpg" alt="Map" class="map-image" id="mapImage" />
                <div class="area-box" id="areaBox">
                    <div class="resize-handle nw"></div>
                    <div class="resize-handle ne"></div>
                    <div class="resize-handle sw"></div>
                    <div class="resize-handle se"></div>
                </div>
            </div>
            <div class="info-area" id="infoArea">
                <h3>Area Info</h3>
                <div id="infoContent"></div>
                <div class="search-section">
                    <div class="search-box-container">
                        <input type="text" id="keySearchInput" class="search-input" placeholder="Search key or ID (e.g., A3, 111.222.33)" />
                        <button id="searchBtn" class="search-button">Search</button>
                    </div>
                    <div class="search-example">ex: 805.481.85 or B22 or AC14</div>
                    <div id="searchResults" class="search-results"></div>
                </div>
            </div>
            <div class="coordinates-display" id="coordinatesDisplay">
                <h3>Area Box Coordinates</h3>
                <p>X: <span id="coordX">0</span>px</p>
                <p>Y: <span id="coordY">0</span>px</p>
                <p>Width: <span id="coordWidth">0</span>px</p>
                <p>Height: <span id="coordHeight">0</span>px</p>
                <p>Relative X: <span id="coordRelX">0</span>%</p>
                <p>Relative Y: <span id="coordRelY">0</span>%</p>
                <p>Relative Width: <span id="coordRelWidth">0</span>%</p>
                <p>Relative Height: <span id="coordRelHeight">0</span>%</p>
                <button id="copyCoordsBtn">Copy Coordinates</button>
            </div>
        </div>
    </div>

    <script>
        let data = {};
        let currentArea = '';
        let areasList = [];
        let coordinatesData = {};
        let areaToCoordinateMap = {}; // Maps Area1 -> ABCD, Area2 -> EFGHi, etc.
        let uniqueColorDescs = []; // All unique colorDesc values from entire JSON
        let selectedColorDescs = new Set(); // Selected colorDesc filters

        // Check if running locally (file://) or on GitHub Pages
        function isLocal() {
            return window.location.protocol === 'file:' || 
                   window.location.hostname === '' || 
                   window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1';
        }

        // Load JSON file automatically from GitHub Pages
        async function loadData() {
            // Only auto-load if on GitHub Pages
            if (!isLocal()) {
                try {
                    const response = await fetch('export.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    let text = await response.text();
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    extractAreas();
                    renderSidebar();
                    // Auto-select first area if available
                    if (areasList.length > 0) {
                        selectArea(areasList[0]);
                    }
                } catch (error) {
                    console.error('Error loading JSON:', error);
                }
            }
        }

        // Load JSON from local file using File API
        function loadLocalFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    data = JSON.parse(text);
                    extractAreas();
                    renderSidebar();
                    // Don't auto-load coordinates in local mode - user must click button
                    // If coordinates are already loaded, update mapping and sidebar
                    if (Object.keys(coordinatesData).length > 0) {
                        createAreaCoordinateMapping();
                        renderSidebar();
                    }
                    // Auto-select first area if available
                    if (areasList.length > 0) {
                        selectArea(areasList[0]);
                    }
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                    alert('Error parsing JSON file: ' + error.message);
                }
            };
            reader.onerror = function() {
                console.error('Error reading file.');
                alert('Error reading file.');
            };
            reader.readAsText(file);
        }

        // Extract unique areas and colorDescs from data
        function extractAreas() {
            const areasSet = new Set();
            const colorDescSet = new Set();
            
            for (const key in data) {
                const area = data[key]?.area;
                const colorDesc = data[key]?.colorDesc;
                
                if (area) {
                    areasSet.add(area);
                }
                
                if (colorDesc) {
                    colorDescSet.add(colorDesc);
                }
            }
            
            areasList = Array.from(areasSet).sort((a, b) => {
                // Sort areas: Area1, Area2, Area3, etc.
                const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                return aNum - bNum;
            });
            
            // Sort colorDescs alphabetically
            uniqueColorDescs = Array.from(colorDescSet).sort();
            
            console.log('Areas:', areasList);
            console.log('Unique colorDescs:', uniqueColorDescs);
        }

        // Render sidebar with areas and colorDesc items
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            // Keep file-container, remove only area items and colorDesc items
            const existingItems = sidebar.querySelectorAll('.area-item, .color-desc-item, .sidebar-section');
            // Store active state before removing
            const activeAreas = new Set();
            const activeColorDescs = new Set();
            existingItems.forEach(item => {
                if (item.classList.contains('active')) {
                    if (item.classList.contains('color-desc-item')) {
                        activeColorDescs.add(item.dataset.colorDesc);
                    } else if (item.classList.contains('area-item')) {
                        // Extract area name (without coordinate part if present)
                        const text = item.textContent;
                        const areaMatch = text.match(/^(Area\d+)/);
                        if (areaMatch) {
                            activeAreas.add(areaMatch[1]);
                        }
                    }
                }
                item.remove();
            });

            // Check if mobile view
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            
            if (isMobile) {
                // Mobile view: create two sections side by side
                const areasSection = document.createElement('div');
                areasSection.className = 'sidebar-section areas-section';
                
                const colordescSection = document.createElement('div');
                colordescSection.className = 'sidebar-section colordesc-section';
                
                // Render areas in left section (all areas, can be longer than colorDesc)
                for (const area of areasList) {
                    const areaItem = document.createElement('div');
                    areaItem.className = 'area-item';
                    
                    const coordinateKey = areaToCoordinateMap[area];
                    if (coordinateKey) {
                        areaItem.textContent = `${area} (${coordinateKey})`;
                        areaItem.dataset.areaName = area;
                    } else {
                        areaItem.textContent = area;
                        areaItem.dataset.areaName = area;
                    }
                    
                    if (activeAreas.has(area)) {
                        areaItem.classList.add('active');
                    }
                    
                    areaItem.addEventListener('click', () => selectArea(area));
                    areasSection.appendChild(areaItem);
                }
                
                // Render colorDesc items in right section
                for (const colorDesc of uniqueColorDescs) {
                    const colorDescItem = document.createElement('div');
                    colorDescItem.className = 'color-desc-item';
                    colorDescItem.textContent = colorDesc;
                    colorDescItem.dataset.colorDesc = colorDesc;
                    
                    if (activeColorDescs.has(colorDesc)) {
                        colorDescItem.classList.add('active');
                        selectedColorDescs.add(colorDesc);
                    }
                    
                    colorDescItem.addEventListener('click', () => selectColorDesc(colorDesc));
                    colordescSection.appendChild(colorDescItem);
                }
                
                // Add empty items to align rows if areas count > colorDescs count
                const areasCount = areasList.length;
                const colorDescsCount = uniqueColorDescs.length;
                if (areasCount > colorDescsCount) {
                    for (let i = colorDescsCount; i < areasCount; i++) {
                        const emptyItem = document.createElement('div');
                        emptyItem.className = 'color-desc-item';
                        emptyItem.style.visibility = 'hidden'; // Invisible but takes up space
                        emptyItem.style.pointerEvents = 'none'; // Not clickable
                        colordescSection.appendChild(emptyItem);
                    }
                }
                
                sidebar.appendChild(areasSection);
                sidebar.appendChild(colordescSection);
            } else {
                // Desktop view: render vertically as before
                for (const area of areasList) {
                    const areaItem = document.createElement('div');
                    areaItem.className = 'area-item';
                    
                    const coordinateKey = areaToCoordinateMap[area];
                    if (coordinateKey) {
                        areaItem.textContent = `${area} (${coordinateKey})`;
                        areaItem.dataset.areaName = area;
                    } else {
                        areaItem.textContent = area;
                        areaItem.dataset.areaName = area;
                    }
                    
                    if (activeAreas.has(area)) {
                        areaItem.classList.add('active');
                    }
                    
                    areaItem.addEventListener('click', () => selectArea(area));
                    sidebar.appendChild(areaItem);
                }
                
                for (const colorDesc of uniqueColorDescs) {
                    const colorDescItem = document.createElement('div');
                    colorDescItem.className = 'color-desc-item';
                    colorDescItem.textContent = colorDesc;
                    colorDescItem.dataset.colorDesc = colorDesc;
                    
                    if (activeColorDescs.has(colorDesc)) {
                        colorDescItem.classList.add('active');
                        selectedColorDescs.add(colorDesc);
                    }
                    
                    colorDescItem.addEventListener('click', () => selectColorDesc(colorDesc));
                    sidebar.appendChild(colorDescItem);
                }
            }
        }

        // Select/deselect colorDesc (toggle)
        function selectColorDesc(colorDesc) {
            // Clear search results
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.classList.remove('active');
                searchResults.innerHTML = '';
            }
            
            // Deactivate all areas when colorDesc is selected
            const areaItems = document.querySelectorAll('.area-item');
            areaItems.forEach(item => {
                item.classList.remove('active');
            });
            
            if (selectedColorDescs.has(colorDesc)) {
                selectedColorDescs.delete(colorDesc);
                console.log('Deselected colorDesc:', colorDesc);
            } else {
                // Clear other colorDescs and select only this one
                selectedColorDescs.clear();
                selectedColorDescs.add(colorDesc);
                console.log('Selected colorDesc:', colorDesc);
            }
            
            // Update UI for all colorDesc items
            const colorDescItems = document.querySelectorAll('.color-desc-item');
            colorDescItems.forEach(item => {
                if (selectedColorDescs.has(item.dataset.colorDesc)) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
            
            // Update area boxes based on colorDesc filter
            updateAreaBoxes();
            // Update info area
            updateInfoArea();
        }

        // Select/deselect area (toggle)
        function selectArea(area) {
            // Clear search results
            const searchResults = document.getElementById('searchResults');
            if (searchResults) {
                searchResults.classList.remove('active');
                searchResults.innerHTML = '';
            }
            
            // Deactivate all colorDescs when area is selected
            selectedColorDescs.clear();
            const colorDescItems = document.querySelectorAll('.color-desc-item');
            colorDescItems.forEach(item => {
                item.classList.remove('active');
            });
            
            const areaItems = document.querySelectorAll('.area-item');
            // Find by data attribute (original area name) or text content
            const clickedItem = Array.from(areaItems).find(item => 
                item.dataset.areaName === area || item.textContent.includes(area)
            );
            
            if (clickedItem) {
                // Toggle active state
                if (clickedItem.classList.contains('active')) {
                    clickedItem.classList.remove('active');
                    console.log('Deselected area:', area);
                } else {
                    clickedItem.classList.add('active');
                    console.log('Selected area:', area);
                }
            }
            
            // Update currentArea to last selected area (for potential future use)
            const activeAreas = Array.from(areaItems)
                .filter(item => item.classList.contains('active'))
                .map(item => item.dataset.areaName || item.textContent.split(' ')[0]);
            
            if (activeAreas.length > 0) {
                currentArea = activeAreas[activeAreas.length - 1]; // Last selected
            } else {
                currentArea = '';
            }
            // Update area boxes on map
            updateAreaBoxes();
            // Update info area
            updateInfoArea();
        }

        // Load coordinates from JSON file
        async function loadCoordinates() {
            try {
                const response = await fetch('coordinates.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                let text = await response.text();
                // Remove BOM if present
                if (text.charCodeAt(0) === 0xFEFF) {
                    text = text.slice(1);
                }
                coordinatesData = JSON.parse(text);
                console.log('Coordinates loaded:', coordinatesData);
                // Create mapping: Area1 -> first key, Area2 -> second key, etc.
                createAreaCoordinateMapping();
                // Update sidebar to show coordinate names
                renderSidebar();
                // Wait a bit for image to be ready, then update boxes
                setTimeout(() => {
                    updateAreaBoxes();
                    updateInfoArea();
                }, 100);
            } catch (error) {
                console.error('Error loading coordinates:', error);
            }
        }

        // Load coordinates from local file
        function loadLocalCoordinates(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Remove BOM if present
                    if (text.charCodeAt(0) === 0xFEFF) {
                        text = text.slice(1);
                    }
                    coordinatesData = JSON.parse(text);
                    console.log('Coordinates loaded:', coordinatesData);
                    // Create mapping: Area1 -> first key, Area2 -> second key, etc.
                    createAreaCoordinateMapping();
                    // Update sidebar to show coordinate names
                    renderSidebar();
                    // Wait a bit for image to be ready, then update boxes
                    setTimeout(() => {
                        updateAreaBoxes();
                        updateInfoArea();
                    }, 100);
                } catch (error) {
                    console.error('Error parsing coordinates JSON:', error);
                    alert('Error parsing coordinates JSON file: ' + error.message);
                }
            };
            reader.onerror = function() {
                console.error('Error reading coordinates file.');
                alert('Error reading coordinates file.');
            };
            reader.readAsText(file);
        }

        // Create mapping between areas (Area1, Area2, etc.) and coordinate keys (ABCD, EFGHi, etc.)
        function createAreaCoordinateMapping() {
            areaToCoordinateMap = {};
            const coordinateKeys = Object.keys(coordinatesData);
            console.log('Coordinate keys in order:', coordinateKeys);
            
            // Map each area to corresponding coordinate key by index
            for (let i = 0; i < areasList.length && i < coordinateKeys.length; i++) {
                const areaName = areasList[i];
                const coordinateKey = coordinateKeys[i];
                areaToCoordinateMap[areaName] = coordinateKey;
                console.log(`Mapped ${areaName} -> ${coordinateKey}`);
            }
        }

        // Update info area with active areas information
        function updateInfoArea() {
            const infoContent = document.getElementById('infoContent');
            const infoArea = document.getElementById('infoArea');
            if (!infoContent) {
                console.log('infoContent element not found');
                return;
            }

            // Update header based on selected mode
            if (infoArea) {
                const header = infoArea.querySelector('h3');
                if (header) {
                    if (selectedColorDescs.size > 0) {
                        // ColorDesc mode: show selected colorDesc in header
                        const colorDescArray = Array.from(selectedColorDescs);
                        // Make colorDesc words blue
                        const colorDescsHtml = colorDescArray.map(desc => 
                            `<span style="color: #4a9eff;">${desc}</span>`
                        ).join(', ');
                        header.innerHTML = `Area Info, ${colorDescsHtml}`;
                    } else {
                        // Area mode: show default header
                        header.textContent = 'Area Info';
                    }
                }
            }

            // Clear existing content
            infoContent.innerHTML = '';

            // Get active areas (same logic as updateAreaBoxes)
            let areasToShow = [];
            
            if (selectedColorDescs.size > 0) {
                // ColorDesc mode: show all areas that have the selected colorDesc
                const areasWithColorDesc = new Set();
                for (const key in data) {
                    const item = data[key];
                    if (item?.area && selectedColorDescs.has(item?.colorDesc)) {
                        areasWithColorDesc.add(item.area);
                    }
                }
                areasToShow = Array.from(areasWithColorDesc).sort((a, b) => {
                    const aNum = parseInt(a.match(/\d+$/)?.[0] || '0', 10);
                    const bNum = parseInt(b.match(/\d+$/)?.[0] || '0', 10);
                    return aNum - bNum;
                });
            } else {
                // Area mode: show only active areas
                const areaItems = document.querySelectorAll('.area-item');
                areasToShow = Array.from(areaItems)
                    .filter(item => item.classList.contains('active'))
                    .map(item => item.dataset.areaName || item.textContent.split(' ')[0]);
            }

            if (areasToShow.length === 0) {
                return;
            }

            // Process each area
            areasToShow.forEach(areaName => {
                // Get all keys for this area, filtered by colorDesc if selected
                const areaKeys = [];
                for (const key in data) {
                    const item = data[key];
                    if (item?.area === areaName) {
                        // If colorDesc is selected, filter by colorDesc
                        if (selectedColorDescs.size > 0) {
                            if (selectedColorDescs.has(item?.colorDesc)) {
                                areaKeys.push(key);
                            }
                        } else {
                            // No colorDesc filter, include all keys
                            areaKeys.push(key);
                        }
                    }
                }

                // Group by letter prefix and find continuous ranges
                // Keys can be "A1", "AB1", "AC22", etc.
                const letterRanges = {};
                areaKeys.forEach(key => {
                    // Extract letters and number from key using regex
                    // Match: letters at start, then numbers
                    const match = key.match(/^([A-Z]+)(\d+)$/);
                    if (!match) {
                        console.warn(`Invalid key format: ${key}`);
                        return;
                    }
                    
                    const letterPrefix = match[1]; // "A", "AB", "AC", etc.
                    const number = parseInt(match[2], 10); // 1, 22, etc.
                    
                    if (!letterRanges[letterPrefix]) {
                        letterRanges[letterPrefix] = [];
                    }
                    letterRanges[letterPrefix].push(number);
                });

                // Find continuous ranges for each letter
                const letterInfo = {};
                Object.keys(letterRanges).forEach(letter => {
                    const numbers = letterRanges[letter].sort((a, b) => a - b);
                    const ranges = [];
                    let rangeStart = numbers[0];
                    let rangeEnd = numbers[0];
                    
                    for (let i = 1; i < numbers.length; i++) {
                        if (numbers[i] === rangeEnd + 1) {
                            // Continuous, extend range
                            rangeEnd = numbers[i];
                        } else {
                            // Gap found, save current range and start new one
                            ranges.push({ start: rangeStart, end: rangeEnd, count: rangeEnd - rangeStart + 1 });
                            rangeStart = numbers[i];
                            rangeEnd = numbers[i];
                        }
                    }
                    // Don't forget the last range
                    ranges.push({ start: rangeStart, end: rangeEnd, count: rangeEnd - rangeStart + 1 });
                    
                    letterInfo[letter] = ranges;
                });

                // Calculate total
                const total = Object.values(letterInfo).reduce((sum, ranges) => {
                    return sum + ranges.reduce((rangeSum, range) => rangeSum + range.count, 0);
                }, 0);

                // Get coordinate key for display
                const coordinateKey = areaToCoordinateMap[areaName] || '';
                const coordinateDisplay = coordinateKey ? ` (${coordinateKey})` : '';

                // Create section
                const section = document.createElement('div');
                section.className = 'info-area-section';

                // Create title
                const title = document.createElement('div');
                title.className = 'info-area-section-title';
                title.textContent = `${areaName}${coordinateDisplay} (${total} pcs)`;
                section.appendChild(title);

                // Create items for each letter (sorted alphabetically)
                const sortedLetters = Object.keys(letterInfo).sort();
                sortedLetters.forEach(letter => {
                    const ranges = letterInfo[letter];
                    ranges.forEach(range => {
                        const item = document.createElement('div');
                        item.className = 'info-area-item';
                        // Format: C5-14 (first number to last number in continuous range)
                        item.textContent = `${letter}${range.start}-${range.count}`;
                        section.appendChild(item);
                    });
                });

                // Add colorDesc info at the end (only in Area mode, not colorDesc mode)
                if (selectedColorDescs.size === 0) {
                    // Get unique colorDesc values for this area
                    const colorDescsSet = new Set();
                    for (const key in data) {
                        const item = data[key];
                        if (item?.area === areaName && item?.colorDesc) {
                            colorDescsSet.add(item.colorDesc);
                        }
                    }
                    
                    if (colorDescsSet.size > 0) {
                        const colorDescsArray = Array.from(colorDescsSet).sort();
                        const colorDescItem = document.createElement('div');
                        colorDescItem.className = 'info-area-item';
                        colorDescItem.style.marginTop = '10px';
                        colorDescItem.style.fontStyle = 'italic';
                        // Make colorDesc words yellow
                        const colorDescsHtml = colorDescsArray.map(desc => 
                            `<span style="color: #FFD700;">${desc}</span>`
                        ).join(', ');
                        colorDescItem.innerHTML = `Items: ${colorDescsHtml}`;
                        section.appendChild(colorDescItem);
                    }
                }

                infoContent.appendChild(section);
            });
        }

                if (!searchTerm) {
                    searchResults.classList.remove('active');
                    return;
                }

                const searchTermUpper = searchTerm.toUpperCase();
                const foundResults = [];

                // First, try to find as a key (e.g., "A4", "AB1")
                const item = data[searchTermUpper];
                if (item) {
                    foundResults.push({ key: searchTermUpper, item: item });
                } else {
                    // If not found as key, search by ID (e.g., "111.222.33")
                    // Find all keys that contain this ID
                    for (const key in data) {
                        const dataItem = data[key];
                        if (dataItem && dataItem.items) {
                            const foundItem = dataItem.items.find(itemObj => 
                                itemObj.id && itemObj.id === searchTerm
                            );
                            if (foundItem) {
                                foundResults.push({ key: key, item: dataItem });
                            }
                        }
                    }
                }

                if (foundResults.length === 0) {
                    // Not found as key or ID
                    searchResults.innerHTML = '<div class="search-no-results">Not found: ' + searchTerm + '</div>';
                    searchResults.classList.add('active');
                    return;
                }

                // Clear colorDesc selection first
                selectedColorDescs.clear();
                const colorDescItems = document.querySelectorAll('.color-desc-item');
                colorDescItems.forEach(colorDescItem => {
                    colorDescItem.classList.remove('active');

                areaItems.forEach(areaItem => {
                    areaItem.classList.remove('active');

                foundResults.forEach(result => {

                        areasToActivate.add(result.item.area);
                    }
                });

                // Activate all areas that contain the found keys/IDs
                areaItems.forEach(areaItem => {
                    const areaName = areaItem.dataset.areaName || areaItem.textContent.split(' ')[0];
                    if (areasToActivate.has(areaName)) {
                        areaItem.classList.add('active');
                    }
                });

                // Update currentArea to first found area (or last if multiple)
                if (areasToActivate.size > 0) {
                    currentArea = Array.from(areasToActivate)[0];
                }

                // Update area boxes and info area
                updateAreaBoxes();
                updateInfoArea();

                // Display all results

                foundResults.forEach(result => {

                        itemsTitle.className = 'search-result-info';

                            // Highlight the searched ID if it matches

                                itemIdDiv.style.fontWeight = 'bold';
                            }

                    }

                searchResults.classList.add('active');

            // Search button click

                searchBtn.addEventListener('click', performSearch);

            // Enter key in search input

                    }
                });

        // Draggable and resizable box functionality
        let isDragging = false;
        let isResizing = false;
        let currentHandle = null;
        let startX, startY, startLeft, startTop, startWidth, startHeight;
        let boxElement = null;
        let mapContainer = null;
        let mapImage = null;

        function initDraggableBox() {
            boxElement = document.getElementById('areaBox');
            mapContainer = document.getElementById('mapContainer');
            mapImage = document.getElementById('mapImage');

            // Center the box initially
            centerBox();

            // Make box draggable
            boxElement.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);

            // Make resize handles work
            const handles = boxElement.querySelectorAll('.resize-handle');
            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => startResize(e, handle));
            });

            // Update coordinates display
            updateCoordinates();
        }

        function centerBox() {
            if (!mapImage || !boxElement) return;
            
            // Wait for image to load
            if (mapImage.complete) {
                positionBox();
            } else {
                mapImage.addEventListener('load', positionBox);
            }
        }

        function positionBox() {
            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            
            // Calculate image position relative to container
            const imgLeft = imgRect.left - containerRect.left;
            const imgTop = imgRect.top - containerRect.top;
            
            // Center box on image (100x100px box)
            const boxWidth = 100;
            const boxHeight = 100;
            const boxLeft = imgLeft + (imgRect.width / 2) - (boxWidth / 2);
            const boxTop = imgTop + (imgRect.height / 2) - (boxHeight / 2);
            
            boxElement.style.left = boxLeft + 'px';
            boxElement.style.top = boxTop + 'px';
            boxElement.style.width = boxWidth + 'px';
            boxElement.style.height = boxHeight + 'px';
            
            updateCoordinates();
        }

        function startDrag(e) {
            if (e.target.classList.contains('resize-handle')) return;
            isDragging = true;
            const rect = boxElement.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            startLeft = rect.left - containerRect.left;
            startTop = rect.top - containerRect.top;
            e.preventDefault();
        }

        function onDrag(e) {
            if (!isDragging && !isResizing) return;
            
            const containerRect = mapContainer.getBoundingClientRect();
            const imgRect = mapImage.getBoundingClientRect();
            
            if (isDragging) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let newLeft = startLeft + deltaX;
                let newTop = startTop + deltaY;
                
                // Constrain to image bounds
                const imgLeft = imgRect.left - containerRect.left;
                const imgTop = imgRect.top - containerRect.top;
                const maxLeft = imgLeft + imgRect.width - boxElement.offsetWidth;
                const maxTop = imgTop + imgRect.height - boxElement.offsetHeight;
                
                newLeft = Math.max(imgLeft, Math.min(newLeft, maxLeft));
                newTop = Math.max(imgTop, Math.min(newTop, maxTop));
                
                boxElement.style.left = newLeft + 'px';
                boxElement.style.top = newTop + 'px';
            } else if (isResizing) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                
                let newWidth = startWidth;
                let newHeight = startHeight;
                let newLeft = startLeft;
                let newTop = startTop;
                
                const imgRect = mapImage.getBoundingClientRect();
                const imgLeft = imgRect.left - containerRect.left;
                const imgTop = imgRect.top - containerRect.top;
                const maxWidth = imgLeft + imgRect.width - startLeft;
                const maxHeight = imgTop + imgRect.height - startTop;
                
                if (currentHandle.classList.contains('se')) {
                    newWidth = Math.max(50, Math.min(startWidth + deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight + deltaY, maxHeight));
                } else if (currentHandle.classList.contains('sw')) {
                    newWidth = Math.max(50, Math.min(startWidth - deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight + deltaY, maxHeight));
                    newLeft = startLeft + (startWidth - newWidth);
                } else if (currentHandle.classList.contains('ne')) {
                    newWidth = Math.max(50, Math.min(startWidth + deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight - deltaY, maxHeight));
                    newTop = startTop + (startHeight - newHeight);
                } else if (currentHandle.classList.contains('nw')) {
                    newWidth = Math.max(50, Math.min(startWidth - deltaX, maxWidth));
                    newHeight = Math.max(50, Math.min(startHeight - deltaY, maxHeight));
                    newLeft = startLeft + (startWidth - newWidth);
                    newTop = startTop + (startHeight - newHeight);
                }
                
                // Constrain to image bounds
                if (newLeft < imgLeft) {
                    newWidth += (imgLeft - newLeft);
                    newLeft = imgLeft;
                }
                if (newTop < imgTop) {
                    newHeight += (imgTop - newTop);
                    newTop = imgTop;
                }
                
                boxElement.style.left = newLeft + 'px';
                boxElement.style.top = newTop + 'px';
                boxElement.style.width = newWidth + 'px';
                boxElement.style.height = newHeight + 'px';
            }
            
            updateCoordinates();
        }

        function stopDrag() {
            isDragging = false;
            isResizing = false;
            currentHandle = null;
        }

        function startResize(e, handle) {
            isResizing = true;
            currentHandle = handle;
            const rect = boxElement.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            startX = e.clientX;
            startY = e.clientY;
            startLeft = rect.left - containerRect.left;
            startTop = rect.top - containerRect.top;
            startWidth = rect.width;
            startHeight = rect.height;
            e.preventDefault();
            e.stopPropagation();
        }

        function updateCoordinates() {
            if (!boxElement || !mapImage) return;
            
            const boxRect = boxElement.getBoundingClientRect();
            const imgRect = mapImage.getBoundingClientRect();
            const containerRect = mapContainer.getBoundingClientRect();
            
            // Absolute coordinates relative to container
            const absX = boxRect.left - containerRect.left;
            const absY = boxRect.top - containerRect.top;
            const absWidth = boxRect.width;
            const absHeight = boxRect.height;
            
            // Relative coordinates relative to image
            const imgLeft = imgRect.left - containerRect.left;
            const imgTop = imgRect.top - containerRect.top;
            const relX = ((absX - imgLeft) / imgRect.width) * 100;
            const relY = ((absY - imgTop) / imgRect.height) * 100;
            const relWidth = (absWidth / imgRect.width) * 100;
            const relHeight = (absHeight / imgRect.height) * 100;
            
            document.getElementById('coordX').textContent = Math.round(absX);
            document.getElementById('coordY').textContent = Math.round(absY);
            document.getElementById('coordWidth').textContent = Math.round(absWidth);
            document.getElementById('coordHeight').textContent = Math.round(absHeight);
            document.getElementById('coordRelX').textContent = relX.toFixed(2);
            document.getElementById('coordRelY').textContent = relY.toFixed(2);
            document.getElementById('coordRelWidth').textContent = relWidth.toFixed(2);
            document.getElementById('coordRelHeight').textContent = relHeight.toFixed(2);
        }

        // Copy coordinates button
        document.getElementById('copyCoordsBtn').addEventListener('click', function() {
            const coords = {
                x: document.getElementById('coordX').textContent,
                y: document.getElementById('coordY').textContent,
                width: document.getElementById('coordWidth').textContent,
                height: document.getElementById('coordHeight').textContent,
                relX: document.getElementById('coordRelX').textContent,
                relY: document.getElementById('coordRelY').textContent,
                relWidth: document.getElementById('coordRelWidth').textContent,
                relHeight: document.getElementById('coordRelHeight').textContent
            };
            
            const coordsText = `X: ${coords.x}px, Y: ${coords.y}px, Width: ${coords.width}px, Height: ${coords.height}px\n` +
                              `Relative: X: ${coords.relX}%, Y: ${coords.relY}%, Width: ${coords.relWidth}%, Height: ${coords.relHeight}%`;
            
            navigator.clipboard.writeText(coordsText).then(() => {
                this.textContent = 'Copied!';
                setTimeout(() => {
                    this.textContent = 'Copy Coordinates';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        });

        // Handle window resize to adjust box position
        function handleResize() {
            if (boxElement && mapImage) {
                updateCoordinates();
            }
            // Update area boxes when window resizes
            updateAreaBoxes();
            // Update info area when window resizes
            updateInfoArea();
        }

        // Initialize draggable box when page loads
        window.addEventListener('load', function() {
            initDraggableBox();
            // Update area boxes when image loads
            if (mapImage) {
                mapImage.addEventListener('load', updateAreaBoxes);
            }
        });

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                handleResize();
                // Re-render sidebar if switching between mobile/desktop view
                if (areasList.length > 0) {
                    renderSidebar();
                }
            }, 100);
        });
    </script>
</body>
</html>
